    <!-- Lógica principal de la aplicación React -->
    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      const MONTH_NAMES_ES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

      // Componente auxiliar para iconos SVG
      const Icon = ({ path, className = "h-5 w-5" }) => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: path }} />
      );

      const ShoppingCartIcon = ({ className }) => <Icon className={className} path='<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>' />;
      const SearchIcon = ({ className }) => <Icon className={className} path='<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>' />;
      const SunIcon = ({ className }) => <Icon className={className} path='<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>' />;
      const MoonIcon = ({ className }) => <Icon className={className} path='<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>' />;
      const TagIcon = ({ className }) => <Icon className={className} path='<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42Z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>' />;
      const XIcon = ({ className }) => <Icon className={className} path='<path d="M18 6 6 18"/><path d="m6 6 12 12"/>' />;
      const PlusIcon = ({ className }) => <Icon className={className} path='<path d="M5 12h14"/><path d="M12 5v14"/>' />;
      const MinusIcon = ({ className }) => <Icon className={className} path='<path d="M5 12h14"/>' />;
      const TrashIcon = ({ className }) => <Icon className={className} path='<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>' />;
      const SparklesIcon = ({ className }) => <Icon className={className} path='<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/>' />;
      const ChevronRightIcon = ({ className }) => <Icon className={className} path='<path d="m9 18 6-6-6-6"/>' />;
      const SettingsIcon = ({ className }) => <Icon className={className} path='<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>' />;
      const LockIcon = ({ className }) => <Icon className={className} path='<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>' />;
      const LogOutIcon = ({ className }) => <Icon className={className} path='<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>' />;
      const CopyIcon = ({ className }) => <Icon className={className} path='<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>' />;
      const WhatsAppIcon = ({ className }) => <Icon className={className} path='<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>' />;
      const PhoneIcon = ({ className }) => <Icon className={className} path='<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>' />;
      const BotIcon = ({ className }) => <Icon className={className} path='<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>' />;
      const SendIcon = ({ className }) => <Icon className={className} path='<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>' />;
      const SpecialGiftIcon = ({ className }) => <Icon className={className} path='<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>' />;
      const CustomPaletteIcon = ({ className }) => <Icon className={className} path='<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/><path d="M12 12h.01"/><path d="M9.5 15.5h.01"/><path d="M14.5 15.5h.01"/>' />;
      const UploadIcon = ({ className }) => <Icon className={className} path='<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>' />;
      const RotateCcwIcon = ({ className }) => <Icon className={className} path='<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>' />;

      // Normalización de texto para NLP local (minúsculas, sin tildes ni signos)
      const normalizeNlpText = (str = '') =>
        String(str)
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9\s-]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();

      // Base de conocimiento entrenada para atención al cliente BCO Tech
      const AI_INTENTS_KB = [
        {
          id: 'greeting',
          keywords: ['hola', 'buenas', 'buenos dias', 'buenas tardes', 'buenas noches', 'saludos', 'hey', 'que tal', 'inicio', 'ayuda'],
          weight: 2
        },
        {
          id: 'order_status',
          keywords: ['pedido', 'orden', 'rastreo', 'rastrear', 'estado', 'seguimiento', 'ord-', 'esp-', 'per-', 'donde va', 'mi compra'],
          weight: 4
        },
        {
          id: 'offers',
          keywords: ['oferta', 'ofertas', 'descuento', 'descuentos', 'promocion', 'promociones', 'rebaja', 'rebajas', 'barato', 'economico', 'economicos'],
          weight: 3.5
        },
        {
          id: 'shipping',
          keywords: ['envio', 'envios', 'entrega', 'delivery', 'domicilio', 'tarda', 'tiempo', 'ciudad', 'interior', 'pais', 'provincia', 'costo de envio'],
          weight: 3.5
        },
        {
          id: 'payments',
          keywords: ['pago', 'pagos', 'pagar', 'efectivo', 'transferencia', 'tarjeta', 'credito', 'debito', 'contra entrega', 'cuenta', 'metodo'],
          weight: 3.5
        },
        {
          id: 'warranty',
          keywords: ['garantia', 'devolucion', 'devoluciones', 'cambio', 'cambios', 'defecto', 'factura', 'soporte', 'reparacion', 'falla'],
          weight: 3.5
        },
        {
          id: 'hours_contact',
          keywords: ['horario', 'horarios', 'abierto', 'abren', 'cierran', 'telefono', 'whatsapp', 'contacto', 'ubicacion', 'asesor', 'humano'],
          weight: 3.5
        },
        {
          id: 'special_order',
          keywords: ['pedido especial', 'encargo', 'no esta', 'no tienen', 'conseguir', 'importar', 'cotizar', 'fuera de catalogo'],
          weight: 4
        },
        {
          id: 'custom_order',
          keywords: ['personalizado', 'personalizados', 'a medida', 'custom', 'grabar', 'color especial', 'armar pc', 'setup a medida'],
          weight: 4
        }
      ];

      // Motor de Mini-IA local entrenado con catálogo en vivo, órdenes y base de conocimiento
      const runBcoMiniAI = ({ query, products, categories, orders, settings, lastContext }) => {
        const raw = String(query || '').trim();
        const norm = normalizeNlpText(raw);
        const tokens = norm.split(' ').filter(t => t.length > 1);
        const activeProducts = (Array.isArray(products) ? products : []).filter(p => p && p.active);

        // 1. Verificar si el cliente envió un código de pedido explícito (ORD-..., ESP-..., PER-...)
        const codeMatch = raw.toUpperCase().match(/\b(ORD|ESP|PER)-\d{4,8}\b/);
        if (codeMatch) {
          const code = codeMatch[0];
          const foundOrder = (Array.isArray(orders) ? orders : []).find(
            o => String(o.id || o.order_number || '').toUpperCase() === code
          );
          if (foundOrder) {
            return {
              text: `📦 **Estado de tu orden ${code}:**\n• **Cliente:** ${foundOrder.customer_name}\n• **Estado actual:** ${foundOrder.status || 'En proceso'}\n• **Total:** RD$${Number(foundOrder.total || 0).toFixed(2)}\n• **Método:** ${String(foundOrder.payment_method || '').toUpperCase()}\n\nSi deseas seguimiento directo con envío, pulsa el botón de WhatsApp abajo.`,
              actions: [{ type: 'whatsapp', label: 'Consultar orden en WhatsApp', prefill: `Hola BCO Tech, consulto el estado de mi orden ${code}.` }],
              nextContext: 'order_status'
            };
          }
          return {
            text: `Para proteger tus datos, el estado de la orden **${code}** se consulta directamente con nuestro equipo por WhatsApp.`,
            actions: [{ type: 'whatsapp', label: 'Verificar orden por WhatsApp', prefill: `Hola BCO Tech, necesito verificar el estado de mi pedido ${code}.` }],
            nextContext: 'order_status'
          };
        }

        // 2. Buscar coincidencia directa con productos o categorías del catálogo
        const categoryAliases = {
          auriculares: ['auricular', 'auriculares', 'audifono', 'audifonos', 'headset', 'cascos', 'anc', 'bluetooth', 'sonido'],
          teclados: ['teclado', 'teclados', 'mecanico', 'switches', 'rgb', 'keyboard'],
          mouse: ['mouse', 'raton', 'mousepad', 'dpi', 'superlight', 'inalambrico'],
          monitores: ['monitor', 'monitores', 'pantalla', 'ips', '180hz', 'hz', '2k', 'qhd'],
          accesorios: ['accesorio', 'accesorios', 'cable', 'soporte', 'hub', 'cargador'],
          gadgets: ['gadget', 'gadgets', 'smart', 'inteligente', 'tech']
        };

        let matchedCategoryId = null;
        for (const [catId, aliases] of Object.entries(categoryAliases)) {
          if (aliases.some(alias => norm.includes(alias))) {
            matchedCategoryId = catId;
            break;
          }
        }
        if (!matchedCategoryId && Array.isArray(categories)) {
          const foundCat = categories.find(c => norm.includes(normalizeNlpText(c.name)) || norm.includes(normalizeNlpText(c.id)));
          if (foundCat) matchedCategoryId = foundCat.id;
        }

        const asksOffers = /\b(ofertas?|descuentos?|promocion(es)?|rebajas?)\b/.test(norm);

        // Puntaje de coincidencia por producto
        const scoredProducts = activeProducts
          .map(prod => {
            const pName = normalizeNlpText(prod.name);
            const pDesc = normalizeNlpText(prod.description || '');
            const pCat = normalizeNlpText(prod.category || '');
            let score = 0;

            if (matchedCategoryId && pCat === normalizeNlpText(matchedCategoryId)) score += 5;
            if (pName.includes(norm) && norm.length >= 3) score += 8;

            tokens.forEach(tok => {
              if (['que', 'para', 'con', 'los', 'las', 'una', 'unos', 'tienen', 'busco', 'quiero', 'precio', 'cuesta', 'vale', 'hay', 'recomienda', 'recomiendame', 'producto', 'productos'].includes(tok)) {
                return;
              }
              if (pName.includes(tok)) score += 3;
              if (pCat.includes(tok)) score += 2.5;
              if (pDesc.includes(tok)) score += 1.5;
            });

            return { prod, score };
          })
          .filter(item => item.score > 0)
          .sort((a, b) => b.score - a.score);

        // Si el usuario pide recomendación general ("recomienda", "mejor", "catalogo", "que venden")
        const asksCatalogOrRecommend =
          ['recomienda', 'recomiendame', 'catalogo', 'que venden', 'disponible', 'disponibles', 'productos', 'gamer', 'setup'].some(w => norm.includes(w)) &&
          scoredProducts.length === 0;

        if (!asksOffers && (scoredProducts.length > 0 || asksCatalogOrRecommend)) {
          const isCheapFilter = ['barato', 'economico', 'economicos', 'menor precio', 'mas barato'].some(w => norm.includes(w));
          let list = scoredProducts.length > 0 ? scoredProducts.map(s => s.prod) : [...activeProducts];
          if (isCheapFilter) {
            list = [...list].sort((a, b) => Number(a.price) - Number(b.price));
          }
          const topProducts = list.slice(0, 3);
          const headerText =
            scoredProducts.length > 0
              ? `🔎 Encontré **${scoredProducts.length} opción(es)** en nuestro catálogo que coinciden con tu búsqueda:`
              : `⚡ Aquí tienes nuestras recomendaciones destacadas en **BCO Tech**:`;

          return {
            text: `${headerText}\nPuedes agregarlas directo al carrito o ver sus detalles:`,
            products: topProducts,
            actions: [
              { type: 'special', label: '¿No ves el modelo? Pedido Especial' }
            ],
            nextContext: 'catalog'
          };
        }

        // 3. Evaluar intenciones entrenadas (KB)
        let bestIntent = null;
        let bestScore = 0;

        AI_INTENTS_KB.forEach(intent => {
          let score = 0;
          intent.keywords.forEach(kw => {
            const normKw = normalizeNlpText(kw);
            if (norm.includes(normKw)) {
              score += intent.weight + (normKw.includes(' ') ? 1.5 : 0);
            }
          });
          if (score > bestScore) {
            bestScore = score;
            bestIntent = intent.id;
          }
        });

        // 4. Respuestas especializadas por intención
        switch (asksOffers ? 'offers' : bestIntent) {
          case 'greeting':
            return {
              text: `¡Hola! 👋 Soy la **IA de BCO Tech**. Estoy entrenada para ayudarte al instante con:\n• Búsqueda y precios de productos del catálogo\n• Ofertas activas y disponibilidad\n• Envíos, métodos de pago y garantía\n• Pedidos especiales o personalizados\n\n¿Qué equipo o accesorio buscas hoy?`,
              nextContext: 'greeting'
            };

          case 'offers': {
            const onSaleList = activeProducts.filter(p => p.on_sale);
            if (onSaleList.length > 0) {
              return {
                text: `🔥 ¡Tenemos **${onSaleList.length} producto(s) en oferta** ahora mismo con descuento especial!`,
                products: onSaleList.slice(0, 3),
                nextContext: 'offers'
              };
            }
            const minPrice = activeProducts.length ? Math.min(...activeProducts.map(p => Number(p.price))) : 0;
            return {
              text: `Actualmente tenemos productos desde **RD$${minPrice.toFixed(2)}**. Puedes activar el filtro **Ofertas** en el catálogo o escribirme qué categoría te interesa.`,
              nextContext: 'offers'
            };
          }

          case 'shipping':
            return {
              text: `🚚 **Envíos y Entregas BCO Tech:**\n• **Cobertura:** Envíos rápidos a todo el país.\n• **Tiempo estimado:** 24 a 48 horas en ciudad principal y 2 a 4 días laborables al interior.\n• **Envío GRATIS:** En compras superiores a **RD$150.00**.\n• **Confirmación:** Al confirmar tu pedido recibes tu factura PDF y coordinamos la entrega por WhatsApp.`,
              actions: [{ type: 'whatsapp', label: 'Coordinar envío por WhatsApp', prefill: 'Hola BCO Tech, quiero consultar el costo y tiempo de envío a mi zona.' }],
              nextContext: 'shipping'
            };

          case 'payments':
            return {
              text: `💳 **Métodos de Pago Aceptados:**\n• **Efectivo contra entrega** (pagas al recibir tu paquete).\n• **Transferencia bancaria** (confirmación inmediata).\n• **Tarjeta / Link de pago** (débito o crédito de forma segura).\n\nTodos nuestros pedidos incluyen **factura en PDF** automática.`,
              nextContext: 'payments'
            };

          case 'warranty':
            return {
              text: `🛡️ **Garantía y Soporte BCO Tech:**\n• Todos nuestros equipos cuentan con **garantía de fábrica** (de 30 días hasta 1 año según el producto).\n• Cambio inmediato en caso de defecto de fábrica reportado dentro de los primeros 7 días.\n• Tu compra genera una **factura PDF oficial** como respaldo.`,
              actions: [{ type: 'whatsapp', label: 'Soporte técnico WhatsApp', prefill: 'Hola BCO Tech, necesito asistencia con garantía o soporte técnico.' }],
              nextContext: 'warranty'
            };

          case 'hours_contact':
            return {
              text: `🕒 **Horarios y Contacto Oficial:**\n• **Horario:** ${settings.store_hours}\n• **WhatsApp directo:** +${settings.whatsapp}\n\nSi deseas atención humana personalizada, haz clic abajo:`,
              actions: [{ type: 'whatsapp', label: 'Abrir WhatsApp Oficial', prefill: 'Hola BCO Tech, me gustaría hablar con un asesor.' }],
              nextContext: 'hours_contact'
            };

          case 'special_order':
            return {
              text: `✨ **Pedidos Especiales (Fuera de Catálogo):**\nSi buscas un modelo específico, tarjeta gráfica, laptop o periférico que aún no está publicado, lo traemos por encargo y te cotizamos sin compromiso.`,
              actions: [{ type: 'special', label: 'Abrir Formulario Pedido Especial' }],
              nextContext: 'special_order'
            };

          case 'custom_order':
            return {
              text: `🎨 **Productos y Setups Personalizados:**\nArmamos configuraciones a tu medida, combinaciones de colores o accesorios personalizados según tu estilo y presupuesto.`,
              actions: [{ type: 'custom', label: 'Solicitar Personalizado' }],
              nextContext: 'custom_order'
            };

          case 'order_status':
            return {
              text: `📦 Para revisar tu pedido, escríbeme tu código de orden (por ejemplo **ORD-123456**, **ESP-123456** o **PER-123456**) o consúltalo directamente con un asesor.`,
              actions: [{ type: 'whatsapp', label: 'Rastrear por WhatsApp', prefill: 'Hola BCO Tech, quiero consultar el estado de mi pedido.' }],
              nextContext: 'order_status'
            };

          default: {
            const minPrice = activeProducts.length ? Math.min(...activeProducts.map(p => Number(p.price))) : 0;
            const maxPrice = activeProducts.length ? Math.max(...activeProducts.map(p => Number(p.price))) : 0;
            return {
              text: `🤔 No identifiqué una palabra clave exacta, pero puedo ayudarte con:\n• **Productos:** Tenemos ${activeProducts.length} artículos activos (desde **RD$${minPrice.toFixed(2)}** hasta **RD$${maxPrice.toFixed(2)}**).\n• **Consultas:** Prueba escribir *"auriculares"*, *"teclado"*, *"ofertas"*, *"envíos"*, *"pagos"* o *"garantía"*.\n• **Encargos:** También gestionamos pedidos especiales y personalizados.`,
              actions: [
                { type: 'special', label: 'Pedido Especial' },
                { type: 'whatsapp', label: 'Hablar con Asesor', prefill: `Hola BCO Tech, tengo una consulta: ${raw}` }
              ],
              nextContext: lastContext || 'fallback'
            };
          }
        }
      };

      // Renderizador ligero de negritas (**texto**) y saltos de línea para respuestas de la IA
      const renderFormattedAiText = (text = '') => {
        return String(text)
          .split('\n')
          .map((line, lineIdx) => {
            const parts = line.split(/(\*\*[^*]+\*\*)/g);
            return (
              <div key={lineIdx} className={line.trim() === '' ? 'h-1.5' : 'leading-relaxed'}>
                {parts.map((part, partIdx) => {
                  if (part.startsWith('**') && part.endsWith('**')) {
                    return (
                      <strong key={partIdx} className="font-bold text-[#8CFF00]">
                        {part.slice(2, -2)}
                      </strong>
                    );
                  }
                  return <span key={partIdx}>{part}</span>;
                })}

        return new Promise((resolve, reject) => {
          try {
            const reader = new FileReader();
            reader.onload = (event) => {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                  height = Math.round((height * maxWidth) / width);
                  width = maxWidth;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const webp = canvas.toDataURL('image/webp', quality);
                resolve(webp.startsWith('data:image/webp') ? webp : canvas.toDataURL('image/jpeg', quality));
              };
              img.onerror = () => reject(new Error('No se pudo procesar la imagen'));
              img.src = event.target.result;
            };
            reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
            reader.readAsDataURL(file);
          } catch (err) {
            reject(err);
          }
        });
      };

        img.onload = () => {
          const scale = Math.min(1, maxW / img.width, maxH / img.height);
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Imagen no válida')); };
        img.src = url;

CREATE OR REPLACE FUNCTION public.ajustar_stock() RETURNS TRIGGER LANGUAGE plpgsql SECURITY DEFINER SET search_path = '' AS $$
DECLARE item JSONB; signo INT := 0;
BEGIN
  IF NEW.status IN ('Confirmado','Entregado') AND NOT OLD.stock_discounted THEN signo := -1; NEW.stock_discounted := TRUE;
  ELSIF NEW.status NOT IN ('Confirmado','Entregado') AND OLD.stock_discounted THEN signo := 1; NEW.stock_discounted := FALSE;
  END IF;
  IF signo <> 0 THEN
    IF EXISTS (SELECT 1 FROM jsonb_array_elements(NEW.items) e WHERE (e->>'quantity')::INT <= 0) THEN RAISE EXCEPTION 'Cantidad no valida en el pedido'; END IF;
    FOR item IN SELECT * FROM jsonb_array_elements(NEW.items) LOOP
      IF signo = -1 AND EXISTS (SELECT 1 FROM public.products WHERE id = item->'product'->>'id' AND stock < (item->>'quantity')::INT) THEN
        RAISE EXCEPTION 'No hay existencias suficientes de %', item->'product'->>'name';
      END IF;
      UPDATE public.products SET stock = stock + signo * (item->>'quantity')::INT WHERE id = item->'product'->>'id';
    END LOOP;
  END IF;
  RETURN NEW;
END $$;

      const buildMonthlySalesStats = (ordersList = [], productsList = []) => {
        const now = new Date();
        const months = [];

        for (let offset = 5; offset >= 0; offset -= 1) {
          const d = new Date(now.getFullYear(), now.getMonth() - offset, 1);
          const year = d.getFullYear();
          const month = d.getMonth();
          const key = `${year}-${String(month + 1).padStart(2, '0')}`;
          months.push({
            key,
            label: `${MONTH_NAMES_ES[month]} ${String(year).slice(-2)}`,
            fullLabel: `${MONTH_NAMES_ES[month]} ${year}`,
            revenue: 0,
            cost: 0,
            profit: 0,
            ordersCount: 0
          });
        }

        const monthMap = new Map(months.map(m => [m.key, m]));
        let totalRevenue = 0;
        let totalCost = 0;
        let totalOrders = 0;

        const productCostById = new Map();
        const productCostByName = new Map();
        (Array.isArray(productsList) ? productsList : []).forEach(prod => {
          const unitCost = Number(prod?.cost ?? Number(prod?.price || 0) * 0.65);
          if (prod?.id) productCostById.set(String(prod.id), unitCost);
          if (prod?.name) productCostByName.set(String(prod.name).trim().toLowerCase(), unitCost);
        });

        (Array.isArray(ordersList) ? ordersList : []).filter(o => SALE_STATUSES.includes(o?.status)).forEach(order => {
          const amount = Number(order?.total || 0);
          totalRevenue += amount;
          totalOrders += 1;

          let orderCost = 0;
          if (Array.isArray(order?.items) && order.items.length > 0) {
            order.items.forEach(item => {
              const qty = Number(item?.quantity || 1);
              const prodId = item?.product?.id ? String(item.product.id) : '';
              const prodName = item?.product?.name ? String(item.product.name).trim().toLowerCase() : '';
              const knownCost =
                item?.product?.cost !== undefined && item?.product?.cost !== null
                  ? Number(item.product.cost)
                  : productCostById.get(prodId) ?? productCostByName.get(prodName);

              const unitCost = knownCost !== undefined && !Number.isNaN(knownCost)
                ? knownCost
                : Number(item?.product?.price || 0) * 0.65;

              orderCost += unitCost * qty;
            });
          } else {
            orderCost = amount * 0.65;
          }

          totalCost += orderCost;

          const parsedDate = order?.created_at ? new Date(order.created_at) : now;
          const safeDate = Number.isNaN(parsedDate.getTime()) ? now : parsedDate;
          const bucketKey = `${safeDate.getFullYear()}-${String(safeDate.getMonth() + 1).padStart(2, '0')}`;
          const bucket = monthMap.get(bucketKey);

          if (bucket) {
            bucket.revenue += amount;
            bucket.cost += orderCost;
            bucket.profit += amount - orderCost;
            bucket.ordersCount += 1;
          }
        });

          try {
            const esc = (s = '') => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x20-\x7E]/g, ' ').replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
            const lines = [];
            let y = 740;
            const pages = [];
            const addLine = (txt, size = 10, bold = false, rgb = '0.08 0.08 0.08', x = 45) => {
              lines.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${rgb} rg 1 0 0 1 ${x} ${y} Tm (${esc(txt)}) Tj ET`);
            };
            lines.push('q 0.0 0.0 0.0 rg 40 725 532 52 re f Q');
            lines.push('q 0.55 1.0 0.0 rg 40 722 532 3 re f Q');
            y = 755;
            addLine('BCO TECH - FACTURA DE PEDIDO', 16, true, '0.55 1.0 0.0', 52);
            y = 735;
            addLine(`Orden: ${order.id}   |   Fecha: ${new Date(order.created_at).toLocaleString('es-DO')}`, 9, false, '0.9 0.9 0.9', 52);

            y = 695;
            addLine('DATOS DEL CLIENTE', 11, true, '0.0 0.2 1.0', 45);
            y -= 16; addLine(`Cliente: ${order.customer_name}`, 10, false, '0.1 0.1 0.1', 45);
            y -= 14; addLine(`Telefono: ${order.phone}`, 10, false, '0.1 0.1 0.1', 45);
            y -= 14; addLine(`Direccion: ${order.address}`, 10, false, '0.1 0.1 0.1', 45);
            y -= 14; addLine(`Metodo de pago: ${String(order.payment_method || '').toUpperCase()}`, 10, false, '0.1 0.1 0.1', 45);

            y -= 28;
            lines.push(`q 0.92 0.94 0.98 rg 40 ${y - 4} 532 20 re f Q`);
            addLine('CANT.', 9, true, '0.05 0.05 0.05', 48);
            addLine('PRODUCTO', 9, true, '0.05 0.05 0.05', 105);
            addLine('SUBTOTAL', 9, true, '0.05 0.05 0.05', 495);

            y -= 20;
            (order.items || []).forEach(item => {
              if (y < 90) {
                pages.push(lines.splice(0).join('\n'));
                y = 740;
              }
              const qty = Number(item.quantity || 1);
              const unit = Number(item.product?.price || 0);
              addLine(`${qty}x`, 10, true, '0.1 0.1 0.1', 50);
              addLine(`${item.product?.name || 'Producto'} (RD$${unit.toFixed(2)} c/u)`.slice(0, 56), 10, false, '0.1 0.1 0.1', 105);
              addLine(`RD$${(qty * unit).toFixed(2)}`, 10, true, '0.1 0.1 0.1', 495);
              y -= 18;
            });

            y -= 8;
            lines.push(`q 0.75 0.75 0.75 RG 40 ${y} m 572 ${y} l S Q`);
            y -= 24;
            addLine('TOTAL A PAGAR:', 13, true, '0.0 0.2 1.0', 360);
            addLine(`RD$${Number(order.total || 0).toFixed(2)}`, 14, true, '0.05 0.05 0.05', 475);

            pages.push(lines.join('\n'));
            const kids = pages.map((_, i) => `${5 + i * 2} 0 R`).join(' ');
            const bodies = [
              '<< /Type /Catalog /Pages 2 0 R >>',
              `<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`,
              '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
              '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>'
            ];
            pages.forEach((content, i) => {
              bodies.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents ${6 + i * 2} 0 R /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> >>`);
              bodies.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
            });
            const objects = bodies.map((body, i) => `${i + 1} 0 obj\n${body}\nendobj\n`);
            let pdf = '%PDF-1.4\n';
            const offsets = [0];
            objects.forEach(o => { offsets.push(pdf.length); pdf += o; });
            const xref = pdf.length;
            pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
            for (let i = 1; i <= objects.length; i++) pdf += `${String(offsets[i]).padStart(10, '0')} 00000 n \n`;
            pdf += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
            const blob = new Blob([pdf], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Factura-BCO-Tech-${order.id}.pdf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1500);
          } catch {}

                <div className="bg-white dark:bg-[#121824] border-2 border-[#8CFF00] rounded-3xl max-w-sm w-full p-6 space-y-4 relative text-xs">
                  <button onClick={() => setLastConfirmedOrder(null)} className="absolute top-4 right-4"><XIcon className="h-5 w-5" /></button>
                  <h3 className="text-base font-bold font-display">Factura #{lastConfirmedOrder.order.id}</h3>
                  <p className="text-gray-400">Total: <span className="text-[#8CFF00] font-bold">RD${Number(lastConfirmedOrder.order.total).toFixed(2)}</span></p>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => generateInvoicePDF(lastConfirmedOrder.order)} className="bg-[#0033FF] text-white font-bold py-2.5 rounded-xl uppercase">PDF</button>
                    <a href={lastConfirmedOrder.waUrl} target="_blank" rel="noreferrer" className="bg-[#8CFF00] text-black font-extrabold py-2.5 rounded-xl uppercase text-center">WhatsApp</a>
                  </div>
                </div>
              </div>
            )}

            {/* Modal de Creación/Edición de Producto con carga de múltiples fotos WebP o por URL */}
            {editingProduct && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80">
                <div className="bg-white dark:bg-[#121824] border border-gray-700 rounded-3xl max-w-md w-full p-6 space-y-3 relative text-xs max-h-[90vh] overflow-y-auto">
                  <button onClick={() => { setEditingProduct(null); setPhotoUrlDraft(''); }} className="absolute top-4 right-4"><XIcon className="h-5 w-5" /></button>
                  <h3 className="font-display font-bold uppercase">{editingProduct.id ? 'Editar Producto' : 'Nuevo Producto'}</h3>
                  <input value={editingProduct.name} onChange={e => setEditingProduct({ ...editingProduct, name: e.target.value })} placeholder="Nombre" className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2" />
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[10px] uppercase font-bold text-gray-400 mb-1">Costo (lo que te sale)</label>
                      <input type="number" step="0.01" value={editingProduct.cost ?? ''} onChange={e => setEditingProduct({ ...editingProduct, cost: parseFloat(e.target.value) || 0 })} placeholder="Costo" className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2" />
                    </div>
                    <div>
                      <label className="block text-[10px] uppercase font-bold text-gray-400 mb-1">Precio de venta</label>
                      <input type="number" step="0.01" value={editingProduct.price} onChange={e => setEditingProduct({ ...editingProduct, price: parseFloat(e.target.value) || 0 })} placeholder="Precio de venta" className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2" />
                    </div>
                  </div>
                  <p className="text-[11px] text-[#8CFF00] font-bold">
                    Ganancia por unidad: RD${(Number(editingProduct.price || 0) - Number(editingProduct.cost ?? Number(editingProduct.price || 0) * 0.65)).toFixed(2)}
                  </p>

                  <div className="grid grid-cols-2 gap-2">
              <label className="block text-[10px] uppercase font-bold text-gray-400">Categoría
                <select value={editingProduct.category || ''} onChange={e => setEditingProduct({ ...editingProduct, category: e.target.value })} className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2 mt-1">
                  {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </label>
              <label className="block text-[10px] uppercase font-bold text-gray-400">Existencias
                <input type="number" min="0" step="1" value={editingProduct.stock ?? 0} onChange={e => setEditingProduct({ ...editingProduct, stock: Math.max(0, parseInt(e.target.value, 10) || 0) })} className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2 mt-1" />
              </label>
              <label className="block text-[10px] uppercase font-bold text-gray-400">Precio anterior
                <input type="number" min="0" step="0.01" value={editingProduct.original_price ?? ''} onChange={e => setEditingProduct({ ...editingProduct, original_price: e.target.value === '' ? null : Number(e.target.value) })} className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2 mt-1" />
              </label>
              <div className="flex flex-col justify-end gap-1">
                {[['active', 'Visible en tienda'], ['on_sale', 'En oferta']].map(([key, label]) => (
                  <label key={key} className="flex items-center gap-2 font-bold">
                    <input type="checkbox" checked={!!editingProduct[key]} onChange={e => setEditingProduct({ ...editingProduct, [key]: e.target.checked })} /> {label}
                  </label>
                ))}
              </div>
            </div>

            {/* Carga de múltiples fotos (archivos comprimidos a WebP o URLs) */}
                  <div className="p-3 rounded-2xl bg-[#0A0D14] border border-dashed border-gray-700 space-y-2.5">
                    <label className="flex items-center gap-1.5 text-[10px] uppercase font-bold text-[#8CFF00]">
                      <UploadIcon className="h-3.5 w-3.5" /> Fotos del producto
                    </label>
                    <input
                      type="file"
                      accept="image/*"
                      multiple
                      onChange={async (e) => {
                        const files = Array.from(e.target.files || []);
                        if (!files.length) return;
                        try {
                          const processed = await Promise.all(files.map(file => compressProductImage(file)));
                          setEditingProduct(prev => ({
                            ...prev,
                            images: [...(prev.images || []), ...processed]
                          }));
                          showToast(`${processed.length} foto(s) agregada(s)`);
                        } catch {
                          showToast('No se pudo cargar una de las fotos');
                        } finally {
                          e.target.value = '';
                        }
                      }}
                      className="w-full text-[11px] text-gray-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-[11px] file:font-bold file:bg-[#0033FF] file:text-white hover:file:opacity-90"
                    />
                    <div className="flex gap-2">
                      <input
                        type="url"
                        value={photoUrlDraft}
                        onChange={e => setPhotoUrlDraft(e.target.value)}
                        placeholder="O pega enlace de imagen (https://...)"
                        className="flex-1 bg-[#121824] border border-gray-700 rounded-xl px-3 py-1.5 text-[11px]"
                      />
                      <button
                        type="button"
                        onClick={() => {
                          const cleanUrl = photoUrlDraft.trim();
                          if (!cleanUrl) return;
                          setEditingProduct(prev => ({
                            ...prev,
                            images: [...(prev.images || []), cleanUrl]
                          }));
                          setPhotoUrlDraft('');
                        }}
                        className="px-3 py-1.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-white font-bold text-[11px]"
                      >
                        Añadir URL
                      </button>
                    </div>
                    {Array.isArray(editingProduct.images) && editingProduct.images.length > 0 && (
                      <div className="flex flex-wrap gap-2 pt-1">
                        {editingProduct.images.map((imgSrc, imgIdx) => (
                          <div key={imgIdx} className="relative w-16 h-16 rounded-xl overflow-hidden border border-gray-700 group">
                            <img src={imgSrc} alt={`Foto ${imgIdx + 1}`} className="w-full h-full object-cover" />
                            <button
                              type="button"
                              onClick={() =>
                                setEditingProduct(prev => ({
                                  ...prev,
                                  images: (prev.images || []).filter((_, i) => i !== imgIdx)
                                }))
                              }
                              className="absolute top-0.5 right-0.5 bg-black/80 text-red-400 rounded-full p-0.5"
                              title="Quitar foto"
                            >
                              <XIcon className="h-3 w-3" />
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <textarea value={editingProduct.description} onChange={e => setEditingProduct({ ...editingProduct, description: e.target.value })} placeholder="Descripción" className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2" />
                  <button onClick={() => saveProduct(editingProduct)} className="w-full bg-[#8CFF00] text-black font-extrabold py-2.5 rounded-xl uppercase">Guardar</button>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
