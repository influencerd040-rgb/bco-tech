  <head>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {

    <!-- Fuentes Inter y Orbitron -->

    <!-- React 18, Supabase JS v2 y Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

    <style>
      html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
      button, a, select, input[type=checkbox] { touch-action: manipulation; }
      .sin-barra { scrollbar-width: none; }
      .sin-barra::-webkit-scrollbar { display: none; }
      #catalogo { scroll-margin-top: 8rem; }
      @media (max-width: 639px) {
        /* 16px evita que el iPhone haga zoom al escribir */
        input, select, textarea { font-size: 16px !important; }
        .espacio-barra { padding-bottom: calc(5rem + env(safe-area-inset-bottom)); }
        .hoja { align-items: flex-end !important; padding: 0 !important; }
        .hoja > * { border-radius: 1.5rem 1.5rem 0 0 !important; max-width: 100% !important; padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)) !important; }
      }
      .hoja > * { max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; }

      /* Movimiento: respuesta al toque y entradas suaves (solo opacidad y posición) */
      :root { --salida: cubic-bezier(0.23, 1, 0.32, 1); --panel: cubic-bezier(0.32, 0.72, 0, 1); }
      button, button[class] { transition: scale 140ms var(--salida), transform 160ms var(--salida), background-color 160ms ease, color 160ms ease, border-color 160ms ease, opacity 160ms ease; }
      button:not(:disabled):active { scale: 0.97; }
      @keyframes fundido { from { opacity: 0; } }
      @keyframes aparecer { from { opacity: 0; translate: 0 8px; } }
      @keyframes ventana { from { opacity: 0; scale: 0.95; } }
      @keyframes subir { from { translate: 0 100%; } }
      @keyframes lateral { from { translate: 100% 0; } }
      @keyframes aviso { from { opacity: 0; translate: 0 -12px; } }
      .hoja, .panel-carrito { animation: fundido 200ms ease; }
      .hoja > * { animation: ventana 220ms var(--salida); }
      .panel-carrito > * { animation: lateral 320ms var(--panel); }
      .aviso { animation: aviso 220ms var(--salida); }
      .tarjeta { animation: aparecer 260ms var(--salida) backwards; }
      .tarjeta:nth-child(2) { animation-delay: 40ms; }
      .tarjeta:nth-child(3) { animation-delay: 75ms; }
      .tarjeta:nth-child(4) { animation-delay: 105ms; }
      .tarjeta:nth-child(5) { animation-delay: 130ms; }
      .tarjeta:nth-child(n+6) { animation-delay: 150ms; }
      @media (max-width: 639px) { .hoja > * { animation: subir 340ms var(--panel); } }
      @media (hover: hover) and (pointer: fine) {
        .foto-producto { transition: transform 200ms var(--salida); }
        .foto-producto:hover { transform: scale(1.05); }
      }
      /* Scroll especial: portada que se aleja; los productos crecen al deslizar (ver ScrollEffects) */
      .portada { scale: calc(1 - var(--portada, 0) * 0.1); opacity: calc(1 - var(--portada, 0) * 0.65); transform-origin: center bottom; }
      /* Carrusel 3D de vidrio */
      .carrusel-escena { position: relative; height: 23rem; perspective: 900px; transform-style: preserve-3d; touch-action: pan-y; cursor: grab; }
      .carrusel-carta { position: absolute; top: 0.5rem; left: 50%; width: 13.25rem; overflow: hidden; border-radius: 1.25rem; cursor: pointer;
        border: 1px solid rgba(255,255,255,0.18); background: rgba(18,24,36,0.78); box-shadow: 0 18px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.14);
        -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); will-change: transform; }
      .carrusel-carta[data-posicion="0"] { border-color: rgba(140,255,0,0.55); }
      html:not(.dark) .carrusel-carta { background: rgba(255,255,255,0.8); border-color: rgba(0,0,0,0.1); box-shadow: 0 14px 30px rgba(15,23,42,0.18); }
      @media (prefers-reduced-motion: reduce) {
        .portada { scale: 1; opacity: 1; }
        html { scroll-behavior: auto; }
        .hoja > *, .panel-carrito > *, .aviso, .tarjeta { animation: fundido 200ms ease; animation-delay: 0ms; }
        button:not(:disabled):active { scale: 1; }
      }
    </style>
  </head>

    <!-- Lógica principal de la aplicación React -->
    <script type="text/babel">
      const { useState, useEffect, useMemo } = React;

      const MONTH_NAMES_ES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

      // Componente auxiliar para iconos SVG
      const Icon = ({ path, className = "h-5 w-5" }) => (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: path }} />
      );

      const ShoppingCartIcon = ({ className }) => <Icon className={className} path='<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>' />;
      const HomeIcon = ({ className }) => <Icon className={className} path='<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>' />;
      const SearchIcon = ({ className }) => <Icon className={className} path='<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>' />;
      const SunIcon = ({ className }) => <Icon className={className} path='<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>' />;
      const MoonIcon = ({ className }) => <Icon className={className} path='<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>' />;
      const TagIcon = ({ className }) => <Icon className={className} path='<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42Z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>' />;
      const XIcon = ({ className }) => <Icon className={className} path='<path d="M18 6 6 18"/><path d="m6 6 12 12"/>' />;
      const PlusIcon = ({ className }) => <Icon className={className} path='<path d="M5 12h14"/><path d="M12 5v14"/>' />;
      const MinusIcon = ({ className }) => <Icon className={className} path='<path d="M5 12h14"/>' />;
      const TrashIcon = ({ className }) => <Icon className={className} path='<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>' />;
      const SparklesIcon = ({ className }) => <Icon className={className} path='<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/>' />;
      const ChevronRightIcon = ({ className }) => <Icon className={className} path='<path d="m9 18 6-6-6-6"/>' />;
      const SettingsIcon = ({ className }) => <Icon className={className} path='<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>' />;
      const LockIcon = ({ className }) => <Icon className={className} path='<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>' />;
      const LogOutIcon = ({ className }) => <Icon className={className} path='<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>' />;
      const CopyIcon = ({ className }) => <Icon className={className} path='<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>' />;
      const WhatsAppIcon = ({ className }) => <Icon className={className} path='<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>' />;
      const PhoneIcon = ({ className }) => <Icon className={className} path='<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>' />;
      const BotIcon = ({ className }) => <Icon className={className} path='<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>' />;
      const SendIcon = ({ className }) => <Icon className={className} path='<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>' />;
      const SpecialGiftIcon = ({ className }) => <Icon className={className} path='<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>' />;
      const CustomPaletteIcon = ({ className }) => <Icon className={className} path='<path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/><path d="M12 12h.01"/><path d="M9.5 15.5h.01"/><path d="M14.5 15.5h.01"/>' />;
      const UploadIcon = ({ className }) => <Icon className={className} path='<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>' />;
      const RotateCcwIcon = ({ className }) => <Icon className={className} path='<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>' />;

      // Normalización de texto para NLP local (minúsculas, sin tildes ni signos)
      const normalizeNlpText = (str = '') =>
        String(str)
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9\s-]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();

      // Base de conocimiento entrenada para atención al cliente BCO Tech
      const AI_INTENTS_KB = [
        {
          id: 'greeting',
          keywords: ['hola', 'buenas', 'buenos dias', 'buenas tardes', 'buenas noches', 'saludos', 'hey', 'que tal', 'inicio', 'ayuda'],
          weight: 2
        },
        {
          id: 'order_status',
          keywords: ['pedido', 'orden', 'rastreo', 'rastrear', 'estado', 'seguimiento', 'ord-', 'esp-', 'per-', 'donde va', 'mi compra'],
          weight: 4
        },
        {
          id: 'offers',
          keywords: ['oferta', 'ofertas', 'descuento', 'descuentos', 'promocion', 'promociones', 'rebaja', 'rebajas', 'barato', 'economico', 'economicos'],
          weight: 3.5
        },
        {
          id: 'shipping',
          keywords: ['envio', 'envios', 'entrega', 'delivery', 'domicilio', 'tarda', 'tiempo', 'ciudad', 'interior', 'pais', 'provincia', 'costo de envio'],
          weight: 3.5
        },
        {
          id: 'payments',
          keywords: ['pago', 'pagos', 'pagar', 'efectivo', 'transferencia', 'tarjeta', 'credito', 'debito', 'contra entrega', 'cuenta', 'metodo'],
          weight: 3.5
        },
        {
          id: 'warranty',
          keywords: ['garantia', 'devolucion', 'devoluciones', 'cambio', 'cambios', 'defecto', 'factura', 'soporte', 'reparacion', 'falla'],
          weight: 3.5
        },
        {
          id: 'hours_contact',
          keywords: ['horario', 'horarios', 'abierto', 'abren', 'cierran', 'telefono', 'whatsapp', 'contacto', 'ubicacion', 'asesor', 'humano'],
          weight: 3.5
        },
        {
          id: 'special_order',
          keywords: ['pedido especial', 'encargo', 'no esta', 'no tienen', 'conseguir', 'importar', 'cotizar', 'fuera de catalogo'],
          weight: 4
        },
        {
          id: 'custom_order',
          keywords: ['personalizado', 'personalizados', 'a medida', 'custom', 'grabar', 'color especial', 'armar pc', 'setup a medida'],
          weight: 4
        }
      ];

      // Motor de Mini-IA local entrenado con catálogo en vivo, órdenes y base de conocimiento
      const runBcoMiniAI = ({ query, products, categories, orders, settings, lastContext }) => {
        const raw = String(query || '').trim();
        const norm = normalizeNlpText(raw);
        const tokens = norm.split(' ').filter(t => t.length > 1);
        const activeProducts = (Array.isArray(products) ? products : []).filter(p => p && p.active);

        // 1. Verificar si el cliente envió un código de pedido explícito (ORD-..., ESP-..., PER-...)
        const codeMatch = raw.toUpperCase().match(/\b(ORD|ESP|PER)-\d{4,8}\b/);
        if (codeMatch) {
          const code = codeMatch[0];
          const foundOrder = (Array.isArray(orders) ? orders : []).find(
            o => String(o.id || o.order_number || '').toUpperCase() === code
          );
          if (foundOrder) {
            return {
              text: `📦 **Estado de tu orden ${code}:**\n• **Cliente:** ${foundOrder.customer_name}\n• **Estado actual:** ${foundOrder.status || 'En proceso'}\n• **Total:** RD$${Number(foundOrder.total || 0).toFixed(2)}\n• **Método:** ${String(foundOrder.payment_method || '').toUpperCase()}\n\nSi deseas seguimiento directo con envío, pulsa el botón de WhatsApp abajo.`,
              actions: [{ type: 'whatsapp', label: 'Consultar orden en WhatsApp', prefill: `Hola BCO Tech, consulto el estado de mi orden ${code}.` }],
              nextContext: 'order_status'
            };
          }
          return {
            text: `Para proteger tus datos, el estado de la orden **${code}** se consulta directamente con nuestro equipo por WhatsApp.`,
            actions: [{ type: 'whatsapp', label: 'Verificar orden por WhatsApp', prefill: `Hola BCO Tech, necesito verificar el estado de mi pedido ${code}.` }],
            nextContext: 'order_status'
          };
        }

        // 2. Buscar coincidencia directa con productos o categorías del catálogo
        const categoryAliases = {
          cargadores: ['cargador', 'cargadores'],
          protectores: ['protector', 'protectores', 'cristal templado', 'mica'],
          relojes: ['reloj', 'relojes', 'smartwatch'],
          covers: ['cover', 'covers', 'forro', 'funda'],
          auriculares: ['auricular', 'auriculares', 'audifono', 'audifonos', 'headset', 'cascos', 'anc', 'bluetooth', 'sonido'],
          teclados: ['teclado', 'teclados', 'mecanico', 'switches', 'rgb', 'keyboard', 'mouse', 'raton', 'mousepad', 'dpi', 'superlight', 'inalambrico'],
          accesorios: ['accesorio', 'accesorios', 'cable', 'soporte', 'hub'],
          gadgets: ['gadget', 'gadgets', 'smart', 'inteligente', 'tech']
        };

        let matchedCategoryId = null;
        for (const [catId, aliases] of Object.entries(categoryAliases)) {
          if (aliases.some(alias => norm.includes(alias))) {
            matchedCategoryId = catId;
            break;
          }
        }
        if (!matchedCategoryId && Array.isArray(categories)) {
          const foundCat = categories.find(c => norm.includes(normalizeNlpText(c.name)) || norm.includes(normalizeNlpText(c.id)));
          if (foundCat) matchedCategoryId = foundCat.id;
        }

        const asksOffers = /\b(ofertas?|descuentos?|promocion(es)?|rebajas?)\b/.test(norm);

        // Puntaje de coincidencia por producto
        const scoredProducts = activeProducts
          .map(prod => {
            const pName = normalizeNlpText(prod.name);
            const pDesc = normalizeNlpText(prod.description || '');
            const pCat = normalizeNlpText(prod.category || '');
            let score = 0;

            if (matchedCategoryId && pCat === normalizeNlpText(matchedCategoryId)) score += 5;
            if (pName.includes(norm) && norm.length >= 3) score += 8;

            tokens.forEach(tok => {
              if (['que', 'para', 'con', 'los', 'las', 'una', 'unos', 'tienen', 'busco', 'quiero', 'precio', 'cuesta', 'vale', 'hay', 'recomienda', 'recomiendame', 'producto', 'productos'].includes(tok)) {
                return;
              }
              if (pName.includes(tok)) score += 3;
              if (pCat.includes(tok)) score += 2.5;
              if (pDesc.includes(tok)) score += 1.5;
            });

            return { prod, score };
          })
          .filter(item => item.score > 0)
          .sort((a, b) => b.score - a.score);

        // Si el usuario pide recomendación general ("recomienda", "mejor", "catalogo", "que venden")
        const asksCatalogOrRecommend =
          ['recomienda', 'recomiendame', 'catalogo', 'que venden', 'disponible', 'disponibles', 'productos', 'gamer', 'setup'].some(w => norm.includes(w)) &&
          scoredProducts.length === 0;

        if (!asksOffers && (scoredProducts.length > 0 || asksCatalogOrRecommend)) {
          const isCheapFilter = ['barato', 'economico', 'economicos', 'menor precio', 'mas barato'].some(w => norm.includes(w));
          let list = scoredProducts.length > 0 ? scoredProducts.map(s => s.prod) : [...activeProducts];
          if (isCheapFilter) {
            list = [...list].sort((a, b) => Number(a.price) - Number(b.price));
          }
          const topProducts = list.slice(0, 3);
          const headerText =
            scoredProducts.length > 0
              ? `🔎 Encontré **${scoredProducts.length} opción(es)** en nuestro catálogo que coinciden con tu búsqueda:`
              : `⚡ Aquí tienes nuestras recomendaciones destacadas en **BCO Tech**:`;

          return {
            text: `${headerText}\nPuedes agregarlas directo al carrito o ver sus detalles:`,
            products: topProducts,
            actions: [
              { type: 'special', label: '¿No ves el modelo? Pedido Especial' }
            ],
            nextContext: 'catalog'
          };
        }

        // 3. Evaluar intenciones entrenadas (KB)
        let bestIntent = null;
        let bestScore = 0;

        AI_INTENTS_KB.forEach(intent => {
          let score = 0;
          intent.keywords.forEach(kw => {
            const normKw = normalizeNlpText(kw);
            if (norm.includes(normKw)) {
              score += intent.weight + (normKw.includes(' ') ? 1.5 : 0);
            }
          });
          if (score > bestScore) {
            bestScore = score;
            bestIntent = intent.id;
          }
        });

        // 4. Respuestas especializadas por intención
        switch (asksOffers ? 'offers' : bestIntent) {
          case 'greeting':
            return {
              text: `¡Hola! 👋 Soy la **IA de BCO Tech**. Estoy entrenada para ayudarte al instante con:\n• Búsqueda y precios de productos del catálogo\n• Ofertas activas y disponibilidad\n• Envíos, métodos de pago y garantía\n• Pedidos especiales o personalizados\n\n¿Qué equipo o accesorio buscas hoy?`,
              nextContext: 'greeting'
            };

          case 'offers': {
            const onSaleList = activeProducts.filter(p => p.on_sale);
            if (onSaleList.length > 0) {
              return {
                text: `🔥 ¡Tenemos **${onSaleList.length} producto(s) en oferta** ahora mismo con descuento especial!`,
                products: onSaleList.slice(0, 3),
                nextContext: 'offers'
              };
            }
            const minPrice = activeProducts.length ? Math.min(...activeProducts.map(p => Number(p.price))) : 0;
            return {
              text: `Actualmente tenemos productos desde **RD$${minPrice.toFixed(2)}**. Puedes activar el filtro **Ofertas** en el catálogo o escribirme qué categoría te interesa.`,
              nextContext: 'offers'
            };
          }

        return new Promise((resolve, reject) => {
          try {
            const reader = new FileReader();
            reader.onload = (event) => {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                if (width > maxWidth) {
                  height = Math.round((height * maxWidth) / width);
                  width = maxWidth;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const webp = canvas.toDataURL('image/webp', quality);
                resolve(webp.startsWith('data:image/webp') ? webp : canvas.toDataURL('image/jpeg', quality));
              };
              img.onerror = () => reject(new Error('No se pudo procesar la imagen'));
              img.src = event.target.result;
            };
            reader.onerror = () => reject(new Error('No se pudo leer el archivo'));

-- Descontar inventario al confirmar y devolverlo al cancelar
CREATE OR REPLACE FUNCTION public.ajustar_stock() RETURNS TRIGGER LANGUAGE plpgsql SECURITY DEFINER SET search_path = '' AS $$
DECLARE item JSONB; pos BIGINT; disponible INT; tomado INT; devolver BOOLEAN := FALSE; descontar BOOLEAN := FALSE;
BEGIN
  NEW.stock_discounted := OLD.stock_discounted;
  IF NEW.status IN ('Confirmado','Entregado') AND NOT OLD.stock_discounted THEN
    descontar := TRUE; NEW.stock_discounted := TRUE;
  ELSIF NEW.status NOT IN ('Confirmado','Entregado') AND OLD.stock_discounted THEN
    devolver := TRUE; NEW.stock_discounted := FALSE;
  ELSIF OLD.stock_discounted THEN
    -- Pedido ya descontado y editado: si cambian productos o cantidades se ajusta el stock
    IF (SELECT jsonb_agg(jsonb_build_array(value->'product'->>'id', (value->>'quantity')::INT) ORDER BY ordinality) FROM jsonb_array_elements(OLD.items) WITH ORDINALITY)
       IS DISTINCT FROM
       (SELECT jsonb_agg(jsonb_build_array(value->'product'->>'id', (value->>'quantity')::INT) ORDER BY ordinality) FROM jsonb_array_elements(NEW.items) WITH ORDINALITY) THEN
      devolver := TRUE; descontar := TRUE;
    ELSE
      SELECT COALESCE(jsonb_agg(CASE WHEN (OLD.items->((n.ordinality - 1)::INT)) ? 'stock_taken'
               THEN n.value || jsonb_build_object('stock_taken', OLD.items->((n.ordinality - 1)::INT)->'stock_taken')
               ELSE n.value - 'stock_taken' END ORDER BY n.ordinality), '[]'::jsonb)
        INTO NEW.items FROM jsonb_array_elements(NEW.items) WITH ORDINALITY n;
    END IF;
  END IF;

  IF devolver THEN
    -- Se devuelve solo lo que se habia descontado
    FOR item IN SELECT value FROM jsonb_array_elements(OLD.items) LOOP
      UPDATE public.products SET stock = stock + COALESCE((item->>'stock_taken')::INT, (item->>'quantity')::INT) WHERE id = item->'product'->>'id';
    END LOOP;
  END IF;

  IF descontar THEN
    IF EXISTS (SELECT 1 FROM jsonb_array_elements(NEW.items) e WHERE (e->>'quantity')::INT <= 0) THEN RAISE EXCEPTION 'Cantidad no valida en el pedido'; END IF;
    -- Se puede vender sin existencias: se descuenta lo que haya, nunca por debajo de 0
    FOR item, pos IN SELECT value, ordinality FROM jsonb_array_elements(NEW.items) WITH ORDINALITY LOOP
      SELECT stock INTO disponible FROM public.products WHERE id = item->'product'->>'id' FOR UPDATE;
      tomado := GREATEST(0, LEAST(COALESCE(disponible, 0), (item->>'quantity')::INT));
      UPDATE public.products SET stock = stock - tomado WHERE id = item->'product'->>'id';
      NEW.items := jsonb_set(NEW.items, ARRAY[(pos - 1)::TEXT, 'stock_taken'], to_jsonb(tomado));
    END LOOP;
  END IF;
  RETURN NEW;
END $$;

      const buildMonthlySalesStats = (ordersList = [], productsList = []) => {
        const now = new Date();
        const months = [];

        for (let offset = 5; offset >= 0; offset -= 1) {
          const d = new Date(now.getFullYear(), now.getMonth() - offset, 1);
          const year = d.getFullYear();
          const month = d.getMonth();
          const key = `${year}-${String(month + 1).padStart(2, '0')}`;
          months.push({
            key,
            label: `${MONTH_NAMES_ES[month]} ${String(year).slice(-2)}`,
            fullLabel: `${MONTH_NAMES_ES[month]} ${year}`,
            revenue: 0,
            cost: 0,
            profit: 0,
            ordersCount: 0
          });
        }

        const monthMap = new Map(months.map(m => [m.key, m]));
        let totalRevenue = 0;
        let totalCost = 0;
        let totalOrders = 0;

        const productCostById = new Map();
        const productCostByName = new Map();
        (Array.isArray(productsList) ? productsList : []).forEach(prod => {
          const unitCost = Number(prod?.cost ?? Number(prod?.price || 0) * 0.65);
          if (prod?.id) productCostById.set(String(prod.id), unitCost);
          if (prod?.name) productCostByName.set(String(prod.name).trim().toLowerCase(), unitCost);
        });

        (Array.isArray(ordersList) ? ordersList : []).filter(o => SALE_STATUSES.includes(o?.status)).forEach(order => {
          const amount = Number(order?.total || 0);
          totalRevenue += amount;
          totalOrders += 1;

          let orderCost = 0;
          if (Array.isArray(order?.items) && order.items.length > 0) {
            order.items.forEach(item => {
              const qty = Number(item?.quantity || 1);
              const prodId = item?.product?.id ? String(item.product.id) : '';
              const prodName = item?.product?.name ? String(item.product.name).trim().toLowerCase() : '';
              const knownCost =
                item?.product?.cost !== undefined && item?.product?.cost !== null
                  ? Number(item.product.cost)
                  : productCostById.get(prodId) ?? productCostByName.get(prodName);

              const unitCost = knownCost !== undefined && !Number.isNaN(knownCost)
                ? knownCost
                : Number(item?.product?.price || 0) * 0.65;

              orderCost += unitCost * qty;
            });
          } else {
            orderCost = amount * 0.65;
          }

          totalCost += orderCost;

          const parsedDate = order?.created_at ? new Date(order.created_at) : now;
          const safeDate = Number.isNaN(parsedDate.getTime()) ? now : parsedDate;
          const bucketKey = `${safeDate.getFullYear()}-${String(safeDate.getMonth() + 1).padStart(2, '0')}`;
          const bucket = monthMap.get(bucketKey);

          if (bucket) {
            bucket.revenue += amount;
            bucket.cost += orderCost;
            bucket.profit += amount - orderCost;
            bucket.ordersCount += 1;
          }
        });

            onTouchEnd={e => {

              const moved = e.changedTouches[0].clientX - touchX.current;
              touchX.current = null;
              if (Math.abs(moved) > 40) go(moved < 0 ? 1 : -1);
            }}
          >
            <div data-testid="hero-track" className="flex" style={{ transform: `translateX(-${Math.min(index, slides.length - 1) * 100}%)`, transition: animate ? 'transform 0.6s ease' : 'none' }}>
              {slides.map((src, i) => (
                <img key={i} src={src} alt={`Portada ${(i % total) + 1}`} className="w-full shrink-0 h-44 sm:h-80 object-cover" />
              ))}
            </div>
            {total > 1 && (
              <div className="absolute bottom-3 inset-x-0 flex justify-center gap-2">
                {images.map((_, i) => (
                  <button key={i} type="button" aria-label={`Ver imagen ${i + 1}`} onClick={() => { setAnimate(true); setIndex(i); }} className={`h-2.5 rounded-full ${index % total === i ? 'w-6 bg-[#8CFF00]' : 'w-2.5 bg-white/70'}`} />
                ))}
              </div>
            )}
          </div>
        );
      };

      // Fondo de circuitos detrás de los productos: se mueve y lanza pulsos de luz al deslizar
      const TechBackground = ({ theme }) => {
        const lienzo = React.useRef(null);

        useEffect(() => {
          const canvas = lienzo.current;
          const ctx = canvas?.getContext('2d');
          if (!ctx) return;
          const quieto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          const oscuro = theme === 'dark';
          let ancho = 0, alto = 0, bloque = 0, pistas = [], cuadro = 0;
          // Números "al azar" que siempre salen iguales, para que el dibujo no cambie solo
          let semilla = 7;
          const azar = () => (semilla = (semilla * 16807) % 2147483647) / 2147483647;

          const crear = () => {
            semilla = 7;
            bloque = Math.max(700, alto);
            const total = Math.round(Math.min(34, Math.max(14, ancho / 40)));
            pistas = Array.from({ length: total }, (_, i) => {
              let x = ((i + azar()) / total) * ancho;
              let y = azar() * bloque;
              const puntos = [[x, y]];
              let largo = 0;
              for (let paso = 0; paso < 4; paso++) {
                const recto = 40 + azar() * 110;
                const lado = (azar() < 0.5 ? -1 : 1) * (18 + azar() * 40);
                puntos.push([x, y += recto]);
                puntos.push([x += lado, y += Math.abs(lado)]);
                largo += recto + Math.abs(lado) * 1.414;
              }
              return { puntos, largo, fase: azar() * 900, azul: i % 3 === 0 };
            });
          };

          const trazar = (puntos, dy) => {
            ctx.beginPath();
            puntos.forEach(([x, y], i) => i ? ctx.lineTo(x, y + dy) : ctx.moveTo(x, y + dy));
            ctx.stroke();
          };

          const dibujar = () => {
            cuadro = 0;
            const y = quieto ? 0 : window.scrollY;
            ctx.clearRect(0, 0, ancho, alto);
            const corrido = -((y * 0.45) % bloque);
            for (let dy = corrido - bloque; dy < alto; dy += bloque) {
              pistas.forEach(p => {
                const color = p.azul ? (oscuro ? '61,110,255' : '0,51,255') : (oscuro ? '140,255,0' : '70,150,0');
                ctx.setLineDash([]);
                ctx.lineWidth = 1.2;
                ctx.strokeStyle = `rgba(${color},${oscuro ? 0.22 : 0.18})`;
                trazar(p.puntos, dy);
                ctx.fillStyle = `rgba(${color},0.55)`;
                [p.puntos[0], p.puntos[p.puntos.length - 1]].forEach(([px, py]) => {
                  ctx.beginPath(); ctx.arc(px, py + dy, 2.6, 0, Math.PI * 2); ctx.fill();
                });
                if (quieto) return;
                // Pulso de luz que avanza por la pista según lo que se ha deslizado
                const ciclo = p.largo + 160;
                ctx.setLineDash([46, ciclo]);
                ctx.lineDashOffset = 46 - ((y * 0.9 + p.fase) % ciclo);
                ctx.lineWidth = 6; ctx.strokeStyle = `rgba(${color},0.2)`; trazar(p.puntos, dy);
                ctx.lineWidth = 2; ctx.strokeStyle = `rgba(${color},0.95)`; trazar(p.puntos, dy);
              });
            }
          };

          const pedir = () => { if (!cuadro) cuadro = requestAnimationFrame(dibujar); };
          const ajustar = () => {
            const nuevoAncho = canvas.clientWidth, nuevoAlto = canvas.clientHeight;
            const nitidez = Math.min(2, window.devicePixelRatio || 1);
            canvas.width = nuevoAncho * nitidez;
            canvas.height = nuevoAlto * nitidez;
            ctx.setTransform(nitidez, 0, 0, nitidez, 0, 0);
            // La barra del navegador cambia el alto al deslizar: no rehacer el dibujo por eso
            const rehacer = nuevoAncho !== ancho;
            ancho = nuevoAncho; alto = nuevoAlto;
            if (rehacer) crear();
            pedir();
          };
          ajustar();
          window.addEventListener('resize', ajustar);
          if (!quieto) window.addEventListener('scroll', pedir, { passive: true });
          return () => {
            window.removeEventListener('resize', ajustar);
            window.removeEventListener('scroll', pedir);
            cancelAnimationFrame(cuadro);
          };
        }, [theme]);

        return <canvas ref={lienzo} data-testid="fondo-tech" aria-hidden="true" className="fixed inset-0 w-full h-full -z-10 pointer-events-none" />;
      };

      // Carrusel 3D de vidrio: la tarjeta del centro al frente y las demás inclinadas a los lados
      const GlassCarousel = ({ items, onOpen, onAdd, paused }) => {
        const total = items.length;
        // Posición con decimales: así las tarjetas siguen el dedo y no saltan
        const [pos, setPos] = useState(0);
        const [tocando, setTocando] = useState(false);
        const [aLaVista, setALaVista] = useState(true);
        const caja = React.useRef(null);
        const posRef = React.useRef(0);
        const cuadro = React.useRef(0);
        const gesto = React.useRef(null);
        const arrastro = React.useRef(false);
        const mod = (n) => ((n % total) + total) % total;
        const actual = mod(Math.round(pos));
        const quieto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const poner = (p) => { posRef.current = p; setPos(p); };
        const frenar = () => { cancelAnimationFrame(cuadro.current); cuadro.current = 0; };
        const irA = (destino) => {
          frenar();
          const desde = posRef.current;
          const duracion = quieto ? 0 : Math.min(900, 380 + Math.abs(destino - desde) * 120);
          if (!duracion) return poner(destino);
          const arranque = performance.now();
          const paso = (ahora) => {
            const t = Math.min(1, Math.max(0, (ahora - arranque) / duracion));
            poner(desde + (destino - desde) * (1 - Math.pow(1 - t, 3)));
            cuadro.current = t < 1 ? requestAnimationFrame(paso) : 0;
          };
          cuadro.current = requestAnimationFrame(paso);
        };
        const mover = (pasos) => irA(Math.round(posRef.current) + pasos);

        useEffect(() => frenar, []);
        useEffect(() => { frenar(); poner(0); }, [total]);

        useEffect(() => {
          if (!('IntersectionObserver' in window) || !caja.current) return;
          const vigia = new IntersectionObserver(([e]) => setALaVista(e.isIntersecting), { threshold: 0.4 });
          vigia.observe(caja.current);
          return () => vigia.disconnect();
        }, []);

        // Avanza solo, salvo que lo estén tocando, no se vea o haya una ventana abierta
        useEffect(() => {
          if (paused || tocando || !aLaVista || quieto) return;
          const reloj = setTimeout(() => mover(1), 3200);
          return () => clearTimeout(reloj);
        }, [actual, paused, tocando, aLaVista]);

        const empezar = (e) => {
          frenar();
          arrastro.current = false;
          gesto.current = { x: e.clientX, desde: posRef.current, muestras: [[e.clientX, e.timeStamp]] };
          setTocando(true);
        };
        const seguir = (e) => {
          const g = gesto.current;
          if (!g) return;
          const dx = e.clientX - g.x;
          if (!arrastro.current) {
            if (Math.abs(dx) < 6) return;
            arrastro.current = true;
            try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
          }
          g.muestras.push([e.clientX, e.timeStamp]);
          while (g.muestras.length > 2 && e.timeStamp - g.muestras[0][1] > 100) g.muestras.shift();
          poner(g.desde - dx / 130);
        };
        // Al soltar sigue con el impulso del dedo y se acomoda en una tarjeta
        const soltar = (e) => {
          const g = gesto.current;
          if (!g) return;
          gesto.current = null;
          setTocando(false);
          if (!arrastro.current) return irA(Math.round(posRef.current));
          const [x0, t0] = g.muestras[0];
          const velocidad = e.type === 'pointercancel' || e.timeStamp - t0 > 160 ? 0 : (e.clientX - x0) / Math.max(16, e.timeStamp - t0);
          const inicio = Math.round(g.desde);
          let destino = Math.round(posRef.current - velocidad * 1.6);
          const dx = e.clientX - g.x;
          if (destino === inicio && Math.abs(dx) > 30) destino = inicio + (dx < 0 ? 1 : -1);
          irA(Math.max(inicio - 5, Math.min(inicio + 5, destino)));
        };

        const centro = items[actual];
        return (
          <div ref={caja} data-testid="carrusel-3d" aria-roledescription="carrusel" className="-mx-3 sm:mx-0 overflow-hidden select-none">
            <div
              className="carrusel-escena"
              onPointerDown={empezar}
              onPointerMove={seguir}
              onPointerUp={soltar}
              onPointerCancel={soltar}
              onPointerLeave={e => { if (!arrastro.current) soltar(e); }}
            >
              {items.map((prod, i) => {
                let o = mod(i - pos);
                if (o > total / 2) o -= total;
                const lejos = Math.abs(o);
                if (lejos > 3) return null;
                const lugar = i === actual ? 0 : (Math.round(o) || Math.sign(o));
                return (
                  <div
                    key={prod.id}
                    data-testid="carta-3d"
                    data-posicion={lugar}
                    onClick={() => { if (arrastro.current) return; lugar === 0 ? onOpen(prod) : irA(posRef.current + o); }}
                    className="carrusel-carta"
                    style={{
                      transform: `translateX(-50%) translateX(${o * 56}%) translateZ(${-lejos * 110}px) rotateY(${-Math.max(-2, Math.min(2, o)) * 17}deg)`,
                      opacity: lejos <= 2 ? 1 - lejos * 0.22 : Math.max(0, 0.56 * (3 - lejos)),
                      zIndex: 100 - Math.round(lejos * 10),
                      pointerEvents: lejos > 2.2 ? 'none' : 'auto'
                    }}
                  >
                    <img draggable="false" decoding="async" src={prod.images?.[0] || 'https://placehold.co/400x400/121824/8CFF00?text=BCO+Tech'} alt={prod.name} className="w-full aspect-square object-cover" />
                    {prod.on_sale && <span className="absolute top-2 left-2 bg-[#0033FF] text-white text-[10px] font-black px-2.5 py-1 rounded-full">OFERTA</span>}
                    <div className="p-3 space-y-1.5 text-left">
                      <h3 className="font-bold text-xs line-clamp-2 min-h-[2rem] break-words">{prod.name}</h3>
                      <p className="flex flex-wrap items-baseline gap-x-2">
                        <span className="text-base font-black font-display">RD${Number(prod.price).toFixed(2)}</span>
                        {prod.on_sale && prod.original_price && <span className="text-[11px] text-gray-400 line-through">RD${Number(prod.original_price).toFixed(2)}</span>}
                      </p>
                      <button type="button" tabIndex={lugar === 0 ? 0 : -1} onClick={e => { e.stopPropagation(); if (arrastro.current) return; lugar === 0 ? onAdd(prod) : irA(posRef.current + o); }} className="w-full bg-[#8CFF00] text-black font-bold py-2 rounded-xl text-xs">Agregar</button>
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="mx-auto mt-2 w-fit max-w-[92%] flex items-center gap-2 rounded-full border border-gray-300 dark:border-white/15 bg-white/70 dark:bg-white/5 backdrop-blur-md p-1">
              <button type="button" aria-label="Producto anterior" onClick={() => mover(-1)} className="w-9 h-9 rounded-full text-lg font-black">‹</button>
              <span className="text-[11px] font-bold truncate max-w-[11rem]">{centro.name}</span>
              <span className="text-[10px] text-gray-400 shrink-0">{actual + 1}/{total}</span>
              <button type="button" aria-label="Producto siguiente" onClick={() => mover(1)} className="w-9 h-9 rounded-full text-lg font-black">›</button>
            </div>
          </div>
        );
      };

      // Efectos al deslizar la tienda: barra de avance, portada, productos que crecen (estilo Apple Watch) y botón para subir
      const ScrollEffects = () => {
        const barra = React.useRef(null);
        const [lejos, setLejos] = useState(false);

        useEffect(() => {
          const quieto = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          const raiz = document.documentElement;
          let cuadro = 0;
          // Cada producto crece al entrar en la pantalla y se encoge al salir
          const crecer = () => {
            const arriba = (document.querySelector('header')?.offsetHeight || 0) + 50;
            const abajo = window.innerHeight - (window.innerWidth < 640 ? 64 : 0);
            const medidas = [...document.querySelectorAll('.tarjeta')].map(t => {
              const r = t.getBoundingClientRect();
              const alto = t.offsetHeight;
              const centro = r.top + r.height / 2; // el centro no cambia al escalar
              const tramo = Math.min(alto, abajo - arriba) * 0.85 || 1;
              const m = Math.min(1, Math.max(0, Math.min(abajo - (centro - alto / 2), centro + alto / 2 - arriba) / tramo));
              return [t, m * (2 - m)];
            });
            medidas.forEach(([t, m]) => {
              t.style.scale = (0.55 + 0.45 * m).toFixed(3);
              t.style.opacity = (0.3 + 0.7 * m).toFixed(3);
            });
          };
          const medir = () => {
            cuadro = 0;
            const y = window.scrollY;
            const total = raiz.scrollHeight - window.innerHeight;
            if (barra.current) barra.current.style.transform = `scaleX(${total > 0 ? Math.min(1, y / total) : 0})`;
            setLejos(y > 700);
            const portada = document.querySelector('.portada');
            if (portada && !quieto) portada.style.setProperty('--portada', Math.min(1, Math.max(0, y / (portada.offsetHeight || 1))).toFixed(3));
            if (!quieto) crecer();
          };
          const alDeslizar = () => { if (!cuadro) cuadro = requestAnimationFrame(medir); };
          window.addEventListener('scroll', alDeslizar, { passive: true });
          window.addEventListener('resize', alDeslizar);
          medir();

          // Vuelve a medir cuando cambian los productos (categoría, búsqueda, carga)
          const cambios = new MutationObserver(alDeslizar);
          cambios.observe(document.getElementById('root'), { childList: true, subtree: true });

          return () => {
            window.removeEventListener('scroll', alDeslizar);
            window.removeEventListener('resize', alDeslizar);
            cancelAnimationFrame(cuadro);
            cambios.disconnect();
            document.querySelectorAll('.tarjeta').forEach(t => { t.style.scale = ''; t.style.opacity = ''; });
          };
        }, []);

        return (
          <>
            <div ref={barra} data-testid="barra-avance" aria-hidden="true" className="fixed top-0 inset-x-0 h-1 z-[45] bg-[#8CFF00] pointer-events-none" style={{ transformOrigin: 'left', transform: 'scaleX(0)' }} />
            {lejos && (
              <button type="button" aria-label="Volver arriba" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="aviso fixed right-3 sm:right-6 bottom-[calc(4.75rem+env(safe-area-inset-bottom))] sm:bottom-20 z-30 w-11 h-11 rounded-full bg-black text-[#8CFF00] border-2 border-[#8CFF00] shadow-2xl text-lg font-black">↑</button>
            )}
          </>
        );
      };

      // El envío de pedidos continúa aunque el teléfono cambie a WhatsApp
      const orderSafeFetch = (input, init = {}) => {
        const isOrder = String(input?.url || input).includes('/rest/v1/orders') && init.method === 'POST';
        const small = typeof init.body === 'string' && new Blob([init.body]).size < 60000;
        return fetch(input, isOrder && small ? { ...init, keepalive: true } : init);
      };

      // Pedidos pendientes de confirmar: se reintentan si falla la conexión
      const PENDING_KEY = 'bco_pending_orders';
      const readPending = () => {
        try { return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); } catch { return []; }
      };
      const writePending = (list) => {
        try { localStorage.setItem(PENDING_KEY, JSON.stringify(list.slice(-20))); } catch {}
      };
      const sendOrder = async (client, row) => {
        try {
          const { error } = await client.from('orders').insert([row]);
          if (error && error.code !== '23505') return error; // 23505: ya estaba guardado
        } catch (err) {
          return err;
        }
        writePending(readPending().filter(o => o.id !== row.id));
        return null;
      };

      // Avisos de pedidos nuevos en el teléfono del administrador (Web Push)
      const PUSH_PUBLIC_KEY = 'BLI8D5jH9oiLU0ni8Q6zXJbS445pty3po3unC0yeOk1SsGJeZEFJ0W4u_wntD9WVSlSZNcsAl16275W0cCyLzkA';

      const OrderAlerts = ({ client, showToast }) => {
        const supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
        const isApple = /iPhone|iPad|iPod/.test(navigator.userAgent);
        const [active, setActive] = React.useState(false);
        const [busy, setBusy] = React.useState(false);

        const save = async (sub) => {
          const { error } = await client.from('push_subscriptions').upsert({ endpoint: sub.endpoint, subscription: sub.toJSON() });
          if (error) throw new Error(error.message);
        };

        React.useEffect(() => {
          if (!supported || !client || Notification.permission !== 'granted') return;
          navigator.serviceWorker.getRegistration().then(async reg => {
            const sub = await reg?.pushManager.getSubscription();
            if (sub) { await save(sub); setActive(true); }
          }).catch(() => {});
        }, [client]);

        const enable = async () => {
          setBusy(true);
          try {
            if ((await Notification.requestPermission()) !== 'granted') {
              return showToast('Permiso denegado: activa las notificaciones en los ajustes del teléfono');
            }
            await navigator.serviceWorker.register('sw.js');
            const reg = await navigator.serviceWorker.ready;
            const raw = atob(PUSH_PUBLIC_KEY.replace(/-/g, '+').replace(/_/g, '/'));
            const sub = (await reg.pushManager.getSubscription()) ||
              (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: Uint8Array.from(raw, c => c.charCodeAt(0)) }));
            await save(sub);
            setActive(true);
            showToast('Notificaciones activadas en este teléfono');
          } catch (err) {
            showToast(`No se pudo activar: ${err.message}`);
          } finally {
            setBusy(false);
          }
        };

        const disable = async () => {
          const reg = await navigator.serviceWorker.getRegistration();
          const sub = await reg?.pushManager.getSubscription();
          if (sub) {
            await client.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
            await sub.unsubscribe();
          }
          setActive(false);
          showToast('Notificaciones desactivadas en este teléfono');
        };

        const test = async () => {
          const { data, error } = await client.functions.invoke('notificar-pedido', { body: { test: true } });
          showToast(error || !data?.sent ? 'No se pudo enviar la prueba. Desactiva y vuelve a activar.' : 'Prueba enviada: debe llegar en unos segundos');
        };

        return (
          <div data-testid="avisos" className="p-3 rounded-2xl bg-[#0A0D14] text-gray-100 border border-gray-800 space-y-2">
            <p className="font-bold">🔔 Avisos de pedidos nuevos {active && <span className="text-[#8CFF00]">• Activados</span>}</p>
            {!supported ? (
              <p className="text-gray-400">{isApple
                ? 'En iPhone: abre la tienda en Safari, toca Compartir, luego «Añadir a pantalla de inicio». Abre BCO Tech desde ese icono, entra a Admin → Pedidos y activa los avisos.'
                : 'Este navegador no permite avisos. Abre la tienda en Chrome.'}</p>
            ) : active ? (
              <div className="flex flex-wrap gap-2">
                <button type="button" onClick={test} className="px-3 py-2 rounded-xl bg-[#0033FF] text-white font-bold">Enviar prueba</button>
                <button type="button" onClick={disable} className="px-3 py-2 rounded-xl bg-gray-800 text-gray-100 font-bold">Desactivar</button>
              </div>
            ) : (
              <button type="button" onClick={enable} disabled={busy} className="px-3 py-2 rounded-xl bg-[#8CFF00] text-black font-bold disabled:opacity-40">Activar notificaciones</button>
            )}
          </div>
        );
      };

      // Covers: modelo de iPhone y color
      const IPHONE_MODELS = ['11', '12', '13', '14', '15', '16', '17'].flatMap(n => {
        const extra = n === '11' ? ['Pro', 'Pro Max'] : n === '12' || n === '13' ? ['mini', 'Pro', 'Pro Max'] : n === '17' ? ['Pro', 'Pro Max'] : ['Plus', 'Pro', 'Pro Max'];
        return [`iPhone ${n}`, ...extra.map(x => `iPhone ${n} ${x}`)];
      }).concat('iPhone Air', 'iPhone 16e');
      const COVER_COLORS = { Negro: '#111111', Blanco: '#f5f5f5', Transparente: 'linear-gradient(135deg,#fff 40%,#9ca3af)', Gris: '#8b8f96', Azul: '#2563eb', Celeste: '#7dd3fc', Verde: '#16a34a', Rojo: '#dc2626', Rosado: '#f9a8d4', Morado: '#8b5cf6', Lila: '#c4b5fd', Amarillo: '#facc15', Naranja: '#f97316', 'Marrón': '#92603a', Beige: '#e7d3b0', Dorado: '#d4af37' };
      // El modelo se toma del campo; si está vacío, del nombre del producto
      const phoneModelOf = (p) => {
        if (p.phone_model) return p.phone_model;
        const m = String(p.name || '').match(/iphone\s*(1[1-7])(e)?(?:\s*(pro\s*max|pro|plus|mini))?/i);
        if (!m) return '';
        const kind = (m[3] || '').toLowerCase().replace(/\s+/g, ' ');
        const extra = { 'pro max': ' Pro Max', promax: ' Pro Max', pro: ' Pro', plus: ' Plus', mini: ' mini' }[kind] || '';
        return `iPhone ${m[1]}${m[2] ? 'e' : ''}${extra}`;
      };
      const colorOf = (p) => (p?.category === 'covers' && p.color) || '';
      const displayName = (p) => colorOf(p) ? `${String(p.name).trim()} - Color ${colorOf(p)}` : p.name;
      const modelRank = (m) => { const i = IPHONE_MODELS.indexOf(m); return i < 0 ? 999 : i; };

      // Descuento de toda la tienda: se calcula al mostrar, sin cambiar los precios guardados.
      // Si un producto ya tiene una oferta mejor, se queda con esa (no se suman).
      const withStoreDiscount = (p, percent) => {
        const d = Number(percent) || 0;
        if (!(d > 0)) return p;
        const normal = p.on_sale && Number(p.original_price) > Number(p.price) ? Number(p.original_price) : Number(p.price);
        const price = Math.round(normal * (100 - d) / 100);
        return price < Number(p.price) ? { ...p, price, original_price: normal, on_sale: true } : p;
      };

      // Sube las fotos nuevas a Storage; en la base de datos solo queda el enlace
      const uploadPhotos = async (client, folder, images) => {
        const out = [];
        for (const src of images || []) {
          if (!String(src).startsWith('data:')) { out.push(src); continue; }
          const blob = await (await fetch(src)).blob();
          const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${blob.type.split('/')[1] || 'jpg'}`;
          const { error } = await client.storage.from('productos').upload(path, blob, { contentType: blob.type, cacheControl: '31536000' });
          if (error) throw new Error(error.message);
          out.push(client.storage.from('productos').getPublicUrl(path).data.publicUrl);
        }
        return out;
      };

        const sendingRef = React.useRef(false);

        // PDF nativo sin dependencias externas
        const pdfText = (s = '') => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x20-\x7E]/g, ' ').replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');

        const buildPdf = (pages) => {
          const kids = pages.map((_, i) => `${5 + i * 2} 0 R`).join(' ');
          const bodies = [
            '<< /Type /Catalog /Pages 2 0 R >>',
            `<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>`,
            '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
            '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>'
          ];
          pages.forEach((content, i) => {
            bodies.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents ${6 + i * 2} 0 R /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> >>`);
            bodies.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
          });
          const objects = bodies.map((body, i) => `${i + 1} 0 obj\n${body}\nendobj\n`);
          let pdf = '%PDF-1.4\n';
          const offsets = [0];
          objects.forEach(o => { offsets.push(pdf.length); pdf += o; });
          const xref = pdf.length;
          pdf += `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
          for (let i = 1; i <= objects.length; i++) pdf += `${String(offsets[i]).padStart(10, '0')} 00000 n \n`;
          pdf += `trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
          return new Blob([pdf], { type: 'application/pdf' });
        };

        const downloadPdf = (pages, filename) => {
          const url = URL.createObjectURL(buildPdf(pages));

        // PDF con los pedidos pendientes (sin costos), para enviarlo al grupo de trabajo
        const pendingOrders = () => orders.filter(o => o.status !== 'Entregado' && o.status !== 'Cancelado');

        const ordersPdfPages = (list) => {
          const pay = { efectivo: 'Efectivo contra entrega', transferencia: 'Transferencia bancaria', tarjeta: 'Tarjeta / Link de pago' };
          const money = (n) => `RD$${Number(n || 0).toFixed(2)}`;
          const pages = [];
          let lines = [], y = 760;
          const text = (t, x, size = 10, bold = false, rgb = '0.1 0.1 0.1') =>
            lines.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${rgb} rg 1 0 0 1 ${x} ${y} Tm (${pdfText(t)}) Tj ET`);
          const need = (h) => { if (y - h < 40) { pages.push(lines.join('\n')); lines = []; y = 760; } };
          // Parte los textos largos (direcciones, notas) en varias líneas sin cortar nada
          const wrap = (value, x = 40, size = 10, bold = false) => {
            const max = Math.floor((572 - x) / (size * 0.56));
            String(value).split(/\r?\n/).forEach(paragraph => {
              let line = '';
              const flush = () => { if (!line) return; need(14); text(line, x, size, bold); y -= 14; line = ''; };
              paragraph.split(/\s+/).filter(Boolean).forEach(word => {
                for (let i = 0; i < word.length; i += max) {
                  const piece = word.slice(i, i + max);
                  if (line && line.length + piece.length + 1 > max) flush();
                  line = line ? `${line} ${piece}` : piece;
                }
              });
              flush();
            });
          };

          text('BCO TECH - PEDIDOS PENDIENTES', 40, 15, true); y -= 16;
          text(`${new Date().toLocaleString('es-DO')}  |  ${list.length} pedido(s)  |  Total ${money(list.reduce((n, o) => n + Number(o.total || 0), 0))}`, 40, 9); y -= 22;
          list.forEach((o, index) => {
            need(110);
            lines.push(`q 0.9 0.92 0.96 rg 36 ${y - 5} 540 19 re f Q`);
            text(`${index + 1}. ${o.id}  -  ${o.status || 'Nuevo'}${o.created_at ? `  -  ${new Date(o.created_at).toLocaleDateString('es-DO')}` : ''}`, 40, 10, true); y -= 20;
            wrap(`Cliente: ${o.customer_name || '-'}    Tel: ${o.phone || '-'}`);
            wrap(`Direccion: ${o.address || '-'}`);
            wrap(`Pago: ${pay[o.payment_method] || o.payment_method || '-'}`);
            (Array.isArray(o.items) ? o.items : []).forEach(item => {
              const qty = Number(item.quantity || 1);
              const p = item.product || {};
              const stored = products.find(x => x.id === p.id);

                  <button type="button" aria-label="Cerrar" onClick={() => setIsCheckoutOpen(false)} className="absolute top-2 right-2 p-2.5"><XIcon className="h-5 w-5" /></button>
                  <h3 className="text-base font-bold font-display uppercase">Finalizar Pedido</h3>
                  <input required autoComplete="name" placeholder="Nombre completo *" value={checkoutForm.name} onChange={e => setCheckoutForm({ ...checkoutForm, name: e.target.value })} className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2" />
                  <input required type="tel" inputMode="tel" autoComplete="tel" placeholder="Teléfono / WhatsApp *" value={checkoutForm.phone} onChange={e => setCheckoutForm({ ...checkoutForm, phone: e.target.value })} className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2" />
                  <input required autoComplete="street-address" placeholder="Dirección de entrega *" value={checkoutForm.address} onChange={e => setCheckoutForm({ ...checkoutForm, address: e.target.value })} className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2" />
                  <select value={checkoutForm.paymentMethod} onChange={e => setCheckoutForm({ ...checkoutForm, paymentMethod: e.target.value })} className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2 font-bold">
                    <option value="efectivo">Efectivo contra entrega</option>
                    <option value="transferencia">Transferencia Bancaria</option>
                    <option value="tarjeta">Tarjeta / Link de Pago</option>
                  </select>
                  <button type="submit" className="w-full bg-[#8CFF00] text-black font-extrabold py-3 rounded-2xl uppercase font-display disabled:opacity-50" disabled={isSending}>{isSending ? 'Enviando...' : 'Confirmar Pedido'}</button>
                </form>
              </div>
            )}

            {/* Modal de Confirmación y Factura PDF */}
            {lastConfirmedOrder && (
              <div className="hoja fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80">
                <div className="bg-white dark:bg-[#121824] border-2 border-[#8CFF00] rounded-3xl max-w-sm w-full p-6 space-y-4 relative text-xs">
                  <button onClick={() => setLastConfirmedOrder(null)} className="absolute top-4 right-4"><XIcon className="h-5 w-5" /></button>
                  <h3 className="text-base font-bold font-display">Factura #{lastConfirmedOrder.order.id}</h3>
              <p className="font-bold">{lastConfirmedOrder.saved ? 'Pedido registrado.' : 'Aún no pudimos registrar el pedido.'} Envíalo también por WhatsApp con el botón.</p>
                  <p className="text-gray-400">Total: <span className="text-[#8CFF00] font-bold">RD${Number(lastConfirmedOrder.order.total).toFixed(2)}</span></p>
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => generateInvoicePDF(lastConfirmedOrder.order)} className="bg-[#0033FF] text-white font-bold py-2.5 rounded-xl uppercase">PDF</button>
                    <a href={lastConfirmedOrder.waUrl} target="_blank" rel="noreferrer" className="bg-[#8CFF00] text-black font-extrabold py-2.5 rounded-xl uppercase text-center">WhatsApp</a>
                  </div>
                </div>
              </div>
            )}

            {/* Modal de Creación/Edición de Producto con carga de múltiples fotos WebP o por URL */}
            {orderEdit && (
              <div className="hoja fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80">
                <div data-testid="editor-pedido" className="bg-[#121824] text-gray-100 border border-gray-700 rounded-3xl max-w-lg w-full p-5 space-y-3 text-xs max-h-[90vh] overflow-y-auto">
                  <h3 className="font-display font-bold uppercase text-sm">Editar pedido {orderEdit.id}</h3>
                  <label className="block font-bold">Cliente<input value={orderEdit.customer_name} onChange={e => setEditField('customer_name', e.target.value)} className="w-full mt-1 bg-[#0A0D14] text-gray-100 border border-gray-700 rounded-xl px-3 py-2 text-base sm:text-xs" /></label>
                  <label className="block font-bold">Teléfono<input type="tel" value={orderEdit.phone} onChange={e => setEditField('phone', e.target.value)} className="w-full mt-1 bg-[#0A0D14] text-gray-100 border border-gray-700 rounded-xl px-3 py-2 text-base sm:text-xs" /></label>
                  <label className="block font-bold">Dirección<textarea rows="2" value={orderEdit.address} onChange={e => setEditField('address', e.target.value)} className="w-full mt-1 bg-[#0A0D14] text-gray-100 border border-gray-700 rounded-xl px-3 py-2 text-base sm:text-xs" /></label>
                  <label className="block font-bold">Método de pago
                    <select value={orderEdit.payment_method} onChange={e => setEditField('payment_method', e.target.value)} className="w-full mt-1 bg-[#0A0D14] text-gray-100 border border-gray-700 rounded-xl px-3 py-2 text-base sm:text-xs">
                      <option value="efectivo">Efectivo contra entrega</option>
                      <option value="transferencia">Transferencia bancaria</option>
                      <option value="tarjeta">Tarjeta / Link de pago</option>
                      {!['efectivo', 'transferencia', 'tarjeta'].includes(orderEdit.payment_method) && <option value={orderEdit.payment_method}>{orderEdit.payment_method}</option>}
                    </select>
                  </label>
                  <label className="block font-bold">Notas<textarea rows="2" value={orderEdit.notes} onChange={e => setEditField('notes', e.target.value)} className="w-full mt-1 bg-[#0A0D14] text-gray-100 border border-gray-700 rounded-xl px-3 py-2 text-base sm:text-xs" /></label>

                  <p className="font-bold text-[#8CFF00] uppercase pt-1">Productos</p>
                  {orderEdit.lines.map(l => (
                    <div key={l.key} data-testid="linea-pedido" className="p-3 rounded-2xl border border-gray-800 space-y-2">
                      <div className="flex items-start justify-between gap-2">
                        <p className="font-bold break-words">{l.item.product?.name || 'Producto'}</p>
                        <button type="button" aria-label={`Quitar ${l.item.product?.name}`} onClick={() => setOrderEdit(prev => ({ ...prev, lines: prev.lines.filter(x => x.key !== l.key) }))} className="p-2 rounded-xl bg-red-500/15 text-red-400 shrink-0"><TrashIcon className="h-4 w-4" /></button>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <label className="block text-gray-400">Cantidad<input type="number" min="1" step="1" inputMode="numeric" aria-label={`Cantidad de ${l.item.product?.name}`} value={l.qty} onChange={e => setLine(l.key, 'qty', e.target.value)} className="w-full mt-1 bg-[#0A0D14] text-gray-100 border border-gray-700 rounded-xl px-3 py-2 text-base sm:text-xs" /></label>
                        <label className="block text-gray-400">Precio (RD$)<input type="number" min="0" step="0.01" inputMode="decimal" aria-label={`Precio de ${l.item.product?.name}`} value={l.price} onChange={e => setLine(l.key, 'price', e.target.value)} className="w-full mt-1 bg-[#0A0D14] text-gray-100 border border-gray-700 rounded-xl px-3 py-2 text-base sm:text-xs" /></label>
                      </div>
                    </div>
                  ))}
                  <input type="search" aria-label="Añadir producto al pedido" placeholder="Buscar producto para añadir" value={addSearch} onChange={e => setAddSearch(e.target.value)} className="w-full mt-1 bg-[#0A0D14] text-gray-100 border border-gray-700 rounded-xl px-3 py-2 text-base sm:text-xs" />
                  {addSearch.trim() && (
                    <div className="rounded-2xl border border-gray-800 divide-y divide-gray-800">
                      {products.filter(p => normalizeNlpText(displayName(p)).includes(normalizeNlpText(addSearch))).slice(0, 8).map(p => (
                        <button type="button" key={p.id} onClick={() => addLineToOrder(p)} className="w-full flex items-center gap-2 p-2 text-left">
                          {p.images?.[0] && <img src={p.images[0]} alt="" className="w-10 h-10 rounded-lg object-cover shrink-0" />}
                          <span className="flex-1 min-w-0">{displayName(p)}</span>
                          <span className="font-bold text-[#8CFF00]">RD${Number(p.price).toFixed(2)}</span>
                        </button>
                      ))}
                    </div>
                  )}

                  <label className="block font-bold">Total (mayorista, opcional)
                    <input type="number" min="0" step="0.01" inputMode="decimal" aria-label="Total del pedido" value={orderEdit.total} placeholder={linesSum(orderEdit.lines).toFixed(2)} onChange={e => setEditField('total', e.target.value)} className="w-full mt-1 bg-[#0A0D14] text-gray-100 border border-gray-700 rounded-xl px-3 py-2 text-base sm:text-xs" />
                    <span className="block mt-1 font-normal text-gray-400">Déjalo vacío para sumar los productos.</span>
                  </label>
                  <p className="font-bold text-sm">Nuevo total: RD${Number(String(orderEdit.total).trim() === '' ? linesSum(orderEdit.lines) : orderEdit.total).toFixed(2)}</p>
                  <div className="grid grid-cols-2 gap-2">
                    <button type="button" onClick={() => setOrderEdit(null)} className="py-3 rounded-xl bg-gray-800 text-gray-100 font-bold">Cancelar</button>
                    <button type="button" onClick={saveOrder} className="py-3 rounded-xl bg-[#8CFF00] text-black font-bold">Guardar cambios</button>
                  </div>
                </div>
              </div>
            )}

            {editingProduct && (
              <div className="hoja fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80">
                <div className="bg-white dark:bg-[#121824] border border-gray-700 rounded-3xl max-w-md w-full p-6 space-y-3 relative text-xs max-h-[90vh] overflow-y-auto">
                  <button onClick={() => { setEditingProduct(null); setPhotoUrlDraft(''); }} className="absolute top-4 right-4"><XIcon className="h-5 w-5" /></button>
                  <h3 className="font-display font-bold uppercase">{editingProduct.id ? 'Editar Producto' : 'Nuevo Producto'}</h3>
                  <input value={editingProduct.name} onChange={e => setEditingProduct({ ...editingProduct, name: e.target.value })} placeholder="Nombre" className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2" />
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[10px] uppercase font-bold text-gray-400 mb-1">Costo (lo que te sale)</label>
                      <input type="number" step="0.01" value={editingProduct.cost ?? ''} onChange={e => setEditingProduct({ ...editingProduct, cost: parseFloat(e.target.value) || 0 })} placeholder="Costo" className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2" />
                    </div>
                    <div>
                      <label className="block text-[10px] uppercase font-bold text-gray-400 mb-1">Precio de venta</label>
                      <input type="number" step="0.01" value={editingProduct.price} onChange={e => setEditingProduct({ ...editingProduct, price: parseFloat(e.target.value) || 0 })} placeholder="Precio de venta" className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2" />
                    </div>
                  </div>
                  <p className="text-[11px] text-[#8CFF00] font-bold">
                    Ganancia por unidad: RD${(Number(editingProduct.price || 0) - Number(editingProduct.cost ?? Number(editingProduct.price || 0) * 0.65)).toFixed(2)}
                  </p>

                  <div className="grid grid-cols-2 gap-2">
              <label className="block text-[10px] uppercase font-bold text-gray-400">Categoría
                <select value={editingProduct.category || ''} onChange={e => setEditingProduct({ ...editingProduct, category: e.target.value })} className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2 mt-1">
                  {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </label>
              {editingProduct.category === 'covers' && (
                <div className="grid grid-cols-2 gap-2">
                  <label className="block text-[10px] uppercase font-bold text-gray-400">Modelo de iPhone
                    <select aria-label="Modelo de iPhone" value={phoneModelOf(editingProduct)} onChange={e => setEditingProduct({ ...editingProduct, phone_model: e.target.value || null })} className="w-full bg-[#0A0D14] text-gray-100 border border-gray-700 rounded-xl px-3 py-2 mt-1">
                      <option value="">Sin modelo</option>
                      {IPHONE_MODELS.map(m => <option key={m} value={m}>{m}</option>)}
                    </select>
                  </label>
                  <label className="block text-[10px] uppercase font-bold text-gray-400">Color
                    <select aria-label="Color del cover" value={editingProduct.color || ''} onChange={e => setEditingProduct({ ...editingProduct, color: e.target.value || null })} className="w-full bg-[#0A0D14] text-gray-100 border border-gray-700 rounded-xl px-3 py-2 mt-1">
                      <option value="">Sin color</option>
                      {Object.keys(COVER_COLORS).map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </label>
                </div>
              )}
              <label className="block text-[10px] uppercase font-bold text-gray-400">Existencias
                <input type="number" min="0" step="1" value={editingProduct.stock ?? 0} onChange={e => setEditingProduct({ ...editingProduct, stock: Math.max(0, parseInt(e.target.value, 10) || 0) })} className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2 mt-1" />
              </label>
              <label className="block text-[10px] uppercase font-bold text-gray-400">Precio anterior
                <input type="number" min="0" step="0.01" value={editingProduct.original_price ?? ''} onChange={e => setEditingProduct({ ...editingProduct, original_price: e.target.value === '' ? null : Number(e.target.value) })} className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2 mt-1" />
              </label>
              <div className="flex flex-col justify-end gap-1">
                {[['active', 'Visible en tienda'], ['on_sale', 'En oferta']].map(([key, label]) => (
                  <label key={key} className="flex items-center gap-2 font-bold">
                    <input type="checkbox" checked={!!editingProduct[key]} onChange={e => setEditingProduct({ ...editingProduct, [key]: e.target.checked })} /> {label}
                  </label>
                ))}
              </div>
            </div>

            {/* Carga de múltiples fotos (archivos comprimidos a WebP o URLs) */}
                  <div className="p-3 rounded-2xl bg-[#0A0D14] border border-dashed border-gray-700 space-y-2.5">
                    <label className="flex items-center gap-1.5 text-[10px] uppercase font-bold text-[#8CFF00]">
                      <UploadIcon className="h-3.5 w-3.5" /> Fotos del producto
                    </label>
                    <input
                      type="file"
                      accept="image/*"
                      multiple
                      onChange={async (e) => {
                        const files = Array.from(e.target.files || []);
                        if (!files.length) return;
                        try {
                          const processed = await Promise.all(files.map(file => compressProductImage(file)));
                          setEditingProduct(prev => ({
                            ...prev,
                            images: [...(prev.images || []), ...processed]
                          }));
                          showToast(`${processed.length} foto(s) agregada(s)`);
                        } catch {
                          showToast('No se pudo cargar una de las fotos');
                        } finally {
                          e.target.value = '';
                        }
                      }}
                      className="w-full text-[11px] text-gray-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-[11px] file:font-bold file:bg-[#0033FF] file:text-white hover:file:opacity-90"
                    />
                    <div className="flex gap-2">
                      <input
                        type="url"
                        value={photoUrlDraft}
                        onChange={e => setPhotoUrlDraft(e.target.value)}
                        placeholder="O pega enlace de imagen (https://...)"
                        className="flex-1 bg-[#121824] border border-gray-700 rounded-xl px-3 py-1.5 text-[11px]"
                      />
                      <button
                        type="button"
                        onClick={() => {
                          const cleanUrl = photoUrlDraft.trim();
                          if (!cleanUrl) return;
                          setEditingProduct(prev => ({
                            ...prev,
                            images: [...(prev.images || []), cleanUrl]
                          }));
                          setPhotoUrlDraft('');
                        }}
                        className="px-3 py-1.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-white font-bold text-[11px]"
                      >
                        Añadir URL
                      </button>
                    </div>
                    {Array.isArray(editingProduct.images) && editingProduct.images.length > 0 && (
                      <div className="flex flex-wrap gap-2 pt-1">
                        {editingProduct.images.map((imgSrc, imgIdx) => (
                          <div key={imgIdx} className="relative w-16 h-16 rounded-xl overflow-hidden border border-gray-700 group">
                            <img src={imgSrc} alt={`Foto ${imgIdx + 1}`} className="w-full h-full object-cover" />
                            <button
                              type="button"
                              onClick={() =>
                                setEditingProduct(prev => ({
                                  ...prev,
                                  images: (prev.images || []).filter((_, i) => i !== imgIdx)
                                }))
                              }
                              className="absolute top-0.5 right-0.5 bg-black/80 text-red-400 rounded-full p-0.5"
                              title="Quitar foto"
                            >
                              <XIcon className="h-3 w-3" />
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <textarea value={editingProduct.description} onChange={e => setEditingProduct({ ...editingProduct, description: e.target.value })} placeholder="Descripción" className="w-full bg-[#0A0D14] border border-gray-700 rounded-xl px-3 py-2" />
                  {!editingProduct.id && (editingProduct.images || []).length > 1 && (
                    <div data-testid="separar-fotos" className="p-3 rounded-2xl bg-[#0A0D14] text-gray-100 border border-[#8CFF00]/60 space-y-2">
                      <label className="flex items-start gap-2 font-bold">
                        <input type="checkbox" checked={splitsPhotos(editingProduct)} onChange={e => { const on = e.target.checked; setEditingProduct(prev => ({ ...prev, _split: on })); }} className="mt-0.5" />
                        Crear un producto por cada foto
                      </label>
                      {splitsPhotos(editingProduct) ? (
                        <>
                          <p className="text-gray-400">Se crearán {editingProduct.images.length} productos con el mismo nombre y datos. Cada uno con existencias: {editingProduct.stock ?? 0}.</p>
                          {editingProduct.category === 'covers' && (
                            <div className="grid grid-cols-3 gap-2">
                              {editingProduct.images.map((src, n) => (
                                <div key={n} className="space-y-1">
                                  <img src={src} alt="" className="w-full aspect-square object-cover rounded-xl" />
                                  <select aria-label={`Color de la foto ${n + 1}`} value={editingProduct._colors?.[src] ?? editingProduct.color ?? ''} onChange={e => { const color = e.target.value; setEditingProduct(prev => ({ ...prev, _colors: { ...prev._colors, [src]: color } })); }} className="w-full bg-[#121824] text-gray-100 border border-gray-700 rounded-xl px-1 py-1.5">
                                    <option value="">Color…</option>
                                    {Object.keys(COVER_COLORS).map(c => <option key={c} value={c}>{c}</option>)}
                                  </select>
                                </div>
                              ))}
                            </div>
                          )}
                        </>
                      ) : <p className="text-gray-400">Será un solo producto con {editingProduct.images.length} fotos.</p>}
                    </div>
                  )}
                  <button onClick={saveFromForm} disabled={savingProduct} className="disabled:opacity-50 w-full bg-[#8CFF00] text-black font-extrabold py-2.5 rounded-xl uppercase">{savingProduct ? 'Guardando… espera' : splitsPhotos(editingProduct) ? `Guardar ${editingProduct.images.length} productos` : 'Guardar'}</button>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
